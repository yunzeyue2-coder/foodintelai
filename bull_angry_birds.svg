<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="520" height="640">
  <!-- 牛头 V12牛角 + 疯狂小鸟式大眼睛 -->
  <defs>
    <linearGradient id="hornGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7A6548"/>
      <stop offset="40%" stop-color="#A08865"/>
      <stop offset="100%" stop-color="#C4A880"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#7A5540"/>
    </linearGradient>
  </defs>

  <!-- 牛头脸轮廓（更圆润） -->
  <ellipse cx="130" cy="215" rx="58" ry="62" fill="url(#faceGrad)" stroke="#3D2218" stroke-width="2.5"/>

  <!-- 左耳 -->
  <ellipse cx="72" cy="168" rx="16" ry="22" fill="#8B6B50" stroke="#3D2218" stroke-width="1.5" transform="rotate(-20 72 168)"/>
  
  <!-- 右耳 -->
  <ellipse cx="188" cy="168" rx="16" ry="22" fill="#8B6B50" stroke="#3D2218" stroke-width="1.5" transform="rotate(20 188 168)"/>

  <!-- 左角：竖直向上，微向内弯 -->
  <path d="M 105 165 
           C 95 130, 85 95, 82 60 
           C 80 40, 84 28, 88 22
           C 92 28, 94 42, 97 65
           C 100 90, 107 125, 110 160" 
        fill="url(#hornGrad)" stroke="#5A4A30" stroke-width="2"/>

  <!-- 右角：竖直向上，微向内弯 -->
  <path d="M 155 165 
           C 165 130, 175 95, 178 60 
           C 180 40, 176 28, 172 22
           C 168 28, 166 42, 163 65
           C 160 90, 153 125, 150 160" 
        fill="url(#hornGrad)" stroke="#5A4A30" stroke-width="2"/>

  <!-- ★疯狂小鸟风大眼睛：白色眼眶，巨大瞳孔★ -->
  
  <!-- 左眼白色眼眶（超大） -->
  <ellipse cx="105" cy="195" rx="28" ry="30" fill="white" stroke="#3D2218" stroke-width="2.5"/>
  <!-- 左瞳孔（巨大） -->
  <ellipse cx="108" cy="197" rx="18" ry="20" fill="#1A0A04"/>
  <!-- 左高光 -->
  <ellipse cx="100" cy="188" rx="6" ry="5" fill="white" opacity="0.9"/>
  
  <!-- 右眼白色眼眶（超大） -->
  <ellipse cx="155" cy="195" rx="28" ry="30" fill="white" stroke="#3D2218" stroke-width="2.5"/>
  <!-- 右瞳孔（巨大） -->
  <ellipse cx="152" cy="197" rx="18" ry="20" fill="#1A0A04"/>
  <!-- 右高光 -->
  <ellipse cx="144" cy="188" rx="6" ry="5" fill="white" opacity="0.9"/>

  <!-- 眉毛（粗，表达斗志/专注） -->
  <path d="M 78 175 L 120 182" stroke="#3D2218" stroke-width="4" stroke-linecap="round"/>
  <path d="M 182 175 L 140 182" stroke="#3D2218" stroke-width="4" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <path d="M 120 238 Q 130 248 140 238" fill="none" stroke="#2E180E" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="125" cy="242" rx="5" ry="3.5" fill="#2E180E"/>
  <ellipse cx="135" cy="242" rx="5" ry="3.5" fill="#2E180E"/>

  <!-- 嘴线 -->
  <path d="M 115 258 Q 130 268 145 258" fill="none" stroke="#2E180E" stroke-width="2" stroke-linecap="round"/>
</svg>
