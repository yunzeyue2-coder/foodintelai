<style>
*,::after,::before{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f3efe8;--card:#fff;--text:#1a1a1a;--muted:#8a7a66;
  --accent:#C0392B;--accent-light:#E8652D;--border:#e0d8ce;
  --tag-bg:#e8e0d6;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.04);
  --blue:#3b6fa0;--green:#4a8a5a;--yellow:#c8a040;
}
body{font-family:'Noto Sans SC','Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.page{max-width:780px;margin:0 auto;padding:0 16px 48px}

/* ===== 导航 ===== */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(243,239,232,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
}
.nav-inner{
  max-width:780px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:52px;
}
.nav-brand{display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:700;color:var(--accent);text-decoration:none}
.nav-brand span{font-size:13px;color:var(--muted);font-weight:600}

/* ===== 头部 ===== */
.header{padding:32px 0 20px;text-align:center}
.header h1{font-size:24px;font-weight:800;letter-spacing:1px;color:#1a1a1a}
.header h1 em{font-style:normal;color:var(--accent)}
.header .sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}

/* ===== 数据带 ===== */
.data-strip{max-width:480px;margin:0 auto 16px}
.data-grid{background:var(--card);border-radius:var(--radius);padding:10px 6px;display:flex;border:1px solid var(--border)}
.data-cell{flex:1;text-align:center;padding:0 2px}
.data-cell+.data-cell{border-left:1px solid var(--border)}
.data-num{font-size:17px;font-weight:800;color:var(--accent);line-height:1.2}
.data-label{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.3}
.data-src{font-size:9px;color:#c5b8a8;text-align:center;margin-top:5px}

/* ===== 搜索栏 ===== */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{
  flex:1;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;color:var(--text);background:var(--card);
  outline:none;font-family:'Inter',sans-serif;transition:.15s;
}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,57,43,.06)}
.search-bar input::placeholder{color:var(--muted)}

/* ===== 资产类型 Tab ===== */
.type-tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0}
.type-tabs::-webkit-scrollbar{display:none}
.type-tab{
  flex-shrink:0;padding:7px 14px;border-radius:8px;font-size:12px;
  font-weight:600;background:var(--card);color:var(--muted);
  border:1px solid var(--border);cursor:pointer;transition:.2s;white-space:nowrap;
}
.type-tab:hover{background:var(--tag-bg)}
.type-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== 品类区块（折叠面板） ===== */
.cat-block{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--card)}
.cat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;cursor:pointer;transition:.15s;user-select:none;
  background:var(--card);border-bottom:1px solid transparent;
}
.cat-header:hover{background:#f8f4ef}
.cat-block.open .cat-header{border-bottom-color:var(--border)}
.cat-header .ch-left{display:flex;align-items:center;gap:8px}
.cat-header .ch-icon{font-size:18px;flex-shrink:0}
.cat-header .ch-name{font-size:14px;font-weight:700}
.cat-header .ch-count{font-size:11px;color:var(--muted);font-weight:500}
.cat-header .ch-toggle{font-size:12px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.cat-block.open .cat-header .ch-toggle{transform:rotate(90deg)}
.cat-header .ch-link{
  font-size:11px;color:var(--accent);font-weight:600;margin-left:auto;
  padding:3px 10px;border-radius:4px;background:rgba(192,57,43,.04);transition:.15s;
  flex-shrink:0;
}
.cat-header .ch-link:hover{background:rgba(192,57,43,.1)}
.cat-body{display:none;padding:0 16px 14px}
.cat-block.open .cat-body{display:block}
/* 折叠动画 */
.cat-body-inner{animation:fadeSlide .3s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ===== 知识卡片 ===== */
.asset-card{
  display:block;padding:14px 16px;margin-bottom:8px;
  background:var(--bg);border-radius:10px;
  border:1px solid transparent;transition:.2s;position:relative;
}
.asset-card:last-child{margin-bottom:0}
.asset-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.04)}
.asset-card .ac-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.asset-card .ac-tag{
  font-size:10px;padding:2px 8px;border-radius:4px;
  font-weight:600;white-space:nowrap;flex-shrink:0;
}
.ac-tag-model{background:#e3ecf5;color:#2a5a8a}
.ac-tag-case{background:#f0e8d8;color:#8a6a2a}
.ac-tag-card{background:#dff0e0;color:#3a6a3a}
.ac-tag-resource{background:#f0e0d8;color:#8a4a3a}
.ac-tag-report{background:#f5e8e8;color:#7a3a3a}
.asset-card .ac-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.5;flex:1}
.asset-card .ac-meta{font-size:11px;color:var(--muted);line-height:1.6;display:flex;gap:4px;flex-wrap:wrap}
.asset-card .ac-meta .ac-label{
  font-size:10px;padding:1px 7px;border-radius:3px;
  background:rgba(0,0,0,.03);color:#7a6a5a;
}
.asset-card .ac-meta .ac-update{
  font-size:10px;color:#7a6a5a;margin-left:auto;
}
.asset-card .ac-arrow{font-size:11px;color:#bbb;position:absolute;right:14px;top:14px}

/* ===== 底部 ===== */
.footer{padding:24px 16px 32px;text-align:center;border-top:1px solid var(--border);margin-top:20px}
.footer .ft{font-size:13px;font-weight:700;color:#2a1a0e;margin-bottom:4px}
.footer .fl{margin-top:8px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.footer .fl a{color:var(--accent);font-size:12px}
.footer .copy{font-size:10px;color:#b5aaa0;margin-top:10px;line-height:1.5}
.footer .copy a{color:#8b6914;text-decoration:none}

/* ===== 响应式 ===== */
@media(max-width:520px){
  .header h1{font-size:20px}
  .search-bar{margin-bottom:12px}
  .type-tabs{gap:3px;margin-bottom:14px}
  .type-tab{padding:6px 10px;font-size:11px}
  .cat-header{padding:12px 14px}
  .cat-header .ch-link{font-size:10px;padding:2px 8px}
  .cat-body{padding:0 14px 12px}
  .asset-card{padding:12px 14px}

  .data-grid{padding:8px 4px}
  .data-num{font-size:15px}

</style>

// 品类显示顺序
const CAT_ORDER = ['炸鸡/烹炸','卤味/酱卤','早餐/早点','米线/粉面','面食/陕西','通用框架/方法','商业验证案例','决策内参'];
const CAT_ICONS = {'炸鸡/烹炸':'🍗','卤味/酱卤':'🥩','早餐/早点':'🥟','米线/粉面':'🍜','面食/陕西':'🫓','通用框架/方法':'📐','商业验证案例':'📋','决策内参':'📡'};
const TYPE_LABELS = {model:'诊断模型',case:'实战案例',card:'产品卡片',resource:'产业资源',report:'深度研报'};
const TYPE_CLASSES = {model:'ac-tag-model',case:'ac-tag-case',card:'ac-tag-card',resource:'ac-tag-resource',report:'ac-tag-report'};

let currentType = 'all';

// 统计
function countStats(){
  let stats = {model:0,case:0,card:0,resource:0,report:0};
  for(const [cat, items] of Object.entries(ASSETS)){
    items.forEach(a => { if(stats[a.type]!==undefined) stats[a.type]++; });
  }
  document.getElementById('statModels').textContent = stats.model;
  document.getElementById('statCases').textContent = stats.case;
  document.getElementById('statCards').textContent = stats.card;
  document.getElementById('statReports').textContent = stats.report;
  document.getElementById('statResources').textContent = stats.resource;
}

// 渲染
function renderAssets(type, query){
  const container = document.getElementById('assetContainer');
  let html = '';
  let totalShown = 0;
  
  CAT_ORDER.forEach(catName => {
    const items = ASSETS[catName];
    if(!items || items.length === 0) return;
    
    // 过滤
    let filtered = items;
    if(type !== 'all') filtered = filtered.filter(a => a.type === type);
    if(query && query.trim()){
      const q = query.toLowerCase().trim();
      filtered = filtered.filter(a => 
        a.title.toLowerCase().includes(q) || 
        (a.tags || []).some(t => t.toLowerCase().includes(q))
      );
    }
    if(filtered.length === 0) return;
    totalShown += filtered.length;
    
    const icon = CAT_ICONS[catName] || '📁';
    // 显示3项核心资产，其余折叠
    const shown = filtered.slice(0, 3);
    const extra = filtered.length - 3;
    
    html += '<div class="cat-block open">';
    html += '<div class="cat-header" onclick="this.parentElement.classList.toggle(\'open\')">';
    html += '<div class="ch-left"><span class="ch-icon">'+icon+'</span><span class="ch-name">'+catName+'</span><span class="ch-count">'+filtered.length+'项资产</span></div>';
    html += '<a href="stall.html?cat='+encodeURIComponent(catName)+'" class="ch-link" onclick="event.stopPropagation()">查看全部 →</a>';
    html += '<span class="ch-toggle">›</span>';
    html += '</div>';
    html += '<div class="cat-body"><div class="cat-body-inner">';
    
    shown.forEach(a => {
      html += '<a class="asset-card" href="'+a.url+'">';
      html += '<div class="ac-head">';
      const tl = TYPE_LABELS[a.type] || '未知';
      const tc = TYPE_CLASSES[a.type] || 'ac-tag-model';
      html += '<span class="ac-tag '+tc+'">['+tl+']</span>';
      html += '<span class="ac-title">'+a.title+'</span>';
      html += '</div>';
      html += '<div class="ac-meta">';
      (a.tags || []).forEach(t => { html += '<span class="ac-label">'+t+'</span>'; });
      if(a.update) html += '<span class="ac-update">· '+a.update+'</span>';
      html += '</div>';
      html += '</a>';
    });
    
    if(extra > 0){
      html += '<div style="text-align:center;padding:8px 0;font-size:11px;color:var(--muted)">还有 <strong style="color:var(--accent)">'+extra+'</strong> 项资产 · <a href="stall.html" style="color:var(--accent);font-weight:600">查看全部 →</a></div>';
    }
    
    html += '</div></div></div>';
  });
  
  if(totalShown === 0){
    html = '<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">🔍 没有匹配的资产，试试其他关键词</div>';
  }
  
  container.innerHTML = html;
}

function switchType(type){
  currentType = type;
  document.querySelectorAll('.type-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === type);
  });
  const q = document.getElementById('searchInput').value;
  renderAssets(type, q);
}

function filterAssets(q){
  renderAssets(currentType, q);
}

// 初始化
document.addEventListener('DOMContentLoaded', function(){
  countStats();
  renderAssets('all', '');
});
</script>
