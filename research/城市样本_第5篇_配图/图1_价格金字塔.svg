<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <rect width="800" height="620" fill="#f7f5f0"/>
  <title>City Z 全城餐饮价格梯度金字塔</title>
  <text x="400" y="52" text-anchor="middle" font-family="'PingFang SC','Noto Serif SC',serif" font-size="22" font-weight="700" fill="#1a1a1a">City Z 全城餐饮价格梯度金字塔分布</text>
  <text x="400" y="78" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8a7a6a">N = 61,677 家有效客单样本 · 2025.10–2026.4 快照</text>
  <rect x="140" y="520" width="520" height="56" rx="6" fill="#8b6914"/>
  <text x="160" y="548" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#fff">0 - 15 元 · 极致刚需</text>
  <text x="640" y="548" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#fff">19,263 家 · 31.23%</text>
  <rect x="190" y="452" width="420" height="56" rx="6" fill="#c4a35a"/>
  <text x="210" y="480" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#2a2218">15 - 30 元 · 大众刚需</text>
  <text x="590" y="480" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#2a2218">21,958 家 · 35.60%</text>
  <rect x="240" y="384" width="320" height="56" rx="6" fill="#e8dcc8"/>
  <text x="260" y="412" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#2a2218">30 - 50 元 · 轻社交</text>
  <text x="540" y="412" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#2a2218">11,639 家 · 18.87%</text>
  <rect x="285" y="316" width="230" height="56" rx="6" fill="#d4c8b0"/>
  <text x="400" y="344" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#2a2218">50 - 80 元 · 大众正餐</text>
  <text x="400" y="362" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#6b7280">6,533 家 · 10.59%</text>
  <rect x="330" y="248" width="140" height="56" rx="6" fill="#a08a6a"/>
  <text x="400" y="276" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#fff">80-150 元</text>
  <text x="400" y="292" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#f0ece4">1,911 家 · 3.10%</text>
  <rect x="365" y="180" width="70" height="56" rx="6" fill="#5a4a3a"/>
  <text x="400" y="208" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#fff">&gt;150 元</text>
  <text x="400" y="224" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="10" fill="#d4c8b0">369 家 · 0.60%</text>
  <text x="400" y="166" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#c0392b" font-weight="600">▲ 高客单市场：仅 3.70%</text>
  <text x="400" y="600" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#b5aaa0">来源：City Z 线上餐饮 POI 快照 · FoodIntelAI 城市餐饮研究</text>
  <g transform="translate(690,588)" opacity="0.5">
    <rect x="-14" y="-8" width="110" height="16" rx="8" fill="#c4a35a"/>
    <text x="41" y="3.5" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="#2a2218" letter-spacing="1">FoodIntelAI</text>
  </g>
