<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景（米色纸，与文章页一致） -->
  <rect width="800" height="480" fill="#f7f5f0"/>

  <!-- 标题 -->
  <text x="400" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914" letter-spacing="2">35天 · 五个品类 · 同一条链路</text>
  <text x="400" y="76" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">陕西面食 / 炸鸡 / 卤味 / 早餐 / 米线 —— 反复看到的同一个结构性问题</text>
  <line x1="340" y1="90" x2="460" y2="90" stroke="#c4a35a" stroke-width="3"/>

  <!-- 因素1：区域集中度高 -->
  <rect x="60" y="120" width="240" height="90" rx="14" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
  <text x="180" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#8b6914">区域集中度高</text>
  <text x="180" y="186" text-anchor="middle" font-size="11.5" fill="#8a7a6a">品类困在产区与本地消费圈</text>

  <!-- 因素2：标准化能力不足 -->
  <rect x="60" y="230" width="240" height="90" rx="14" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
  <text x="180" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#8b6914">标准化能力不足</text>
  <text x="180" y="296" text-anchor="middle" font-size="11.5" fill="#8a7a6a">工艺依赖师傅与产地经验</text>

  <!-- 叠加符号 -->
  <text x="330" y="210" text-anchor="middle" font-size="26" font-weight="700" fill="#8b6914">×</text>

  <!-- 汇聚箭头 -->
  <line x1="300" y1="165" x2="470" y2="215" stroke="#8b6914" stroke-width="3"/>
  <line x1="300" y1="275" x2="470" y2="235" stroke="#8b6914" stroke-width="3"/>
  <polygon points="482,227 462,208 466,238" fill="#8b6914"/>

  <!-- 结果1：限制规模天花板 -->
  <rect x="470" y="150" width="280" height="70" rx="14" fill="#fcf8f2" stroke="#c4a35a" stroke-width="2"/>
  <text x="610" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2218">限制单一品牌规模天花板</text>
  <text x="610" y="204" text-anchor="middle" font-size="11" fill="#8a7a6a">规模扩张依赖门店铺设，利润难随规模提升</text>

  <!-- 向下箭头 -->
  <line x1="610" y1="220" x2="610" y2="268" stroke="#8b6914" stroke-width="3"/>
  <polygon points="610,282 596,262 624,262" fill="#8b6914"/>

  <!-- 结果2：削弱全国化 -->
  <rect x="470" y="282" width="280" height="70" rx="14" fill="#fcf8f2" stroke="#c4a35a" stroke-width="2"/>
  <text x="610" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2218">削弱全国化迁移与品牌沉淀</text>
  <text x="610" y="336" text-anchor="middle" font-size="11" fill="#8a7a6a">品类难完成产业翻译，品牌资产难沉淀</text>

  <!-- 底部：结论条 -->
  <rect x="40" y="388" width="720" height="56" rx="12" fill="#0B1F3A"/>
  <text x="400" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#c4a35a" letter-spacing="1">低利润率不是食品行业的宿命，而是增长驱动力的问题</text>

  <!-- 脚注 -->
  <text x="400" y="462" text-anchor="middle" font-size="10.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 第一研究季 · 35天五个品类共性判断 · 2026.08</text>
</svg>
