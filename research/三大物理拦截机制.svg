<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="540" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914" letter-spacing="2">三大物理拦截机制</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">品类不同，空间竞争形态不同 —— 距离即竞争力，形态定打法</text>
  <line x1="330" y1="86" x2="470" y2="86" stroke="#c4a35a" stroke-width="3"/>

  <!-- ===== 机制1：快餐贴身圈 ===== -->
  <rect x="30" y="108" width="235" height="360" rx="12" fill="#ffffff" stroke="#3A8D5D" stroke-width="2"/>
  <text x="147" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2a5a3a">① 快餐贴身圈</text>
  <text x="147" y="158" text-anchor="middle" font-size="11" fill="#8a7a6a">集聚比值 0.296 · 中位 14.2m</text>
  <!-- 中心店 + 密集圈 -->
  <circle cx="147" cy="250" r="26" fill="#3A8D5D"/>
  <text x="147" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">本店</text>
  <g fill="#c4a35a">
    <circle cx="100" cy="215" r="7"/>
    <circle cx="190" cy="210" r="7"/>
    <circle cx="95" cy="285" r="7"/>
    <circle cx="200" cy="288" r="7"/>
    <circle cx="147" cy="195" r="7"/>
    <circle cx="147" cy="310" r="7"/>
    <circle cx="105" cy="250" r="7"/>
    <circle cx="195" cy="250" r="7"/>
  </g>
  <circle cx="147" cy="250" r="80" fill="none" stroke="#3A8D5D" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="147" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#2a5a3a">出店门跨两三间就是竞品</text>
  <text x="147" y="382" text-anchor="middle" font-size="10.5" fill="#8a7a6a">冲动型决策，不为你多走50米</text>
  <rect x="55" y="405" width="185" height="48" rx="8" fill="#e8f4e8"/>
  <text x="147" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#2a5a3a">抢拐角/出入口近场拦截</text>
  <text x="147" y="444" text-anchor="middle" font-size="10" fill="#8a7a6a">拼效率 + 位置卡位</text>

  <!-- ===== 机制2：茶饮点阵围剿 ===== -->
  <rect x="283" y="108" width="235" height="360" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
  <text x="400" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#8b6914">② 茶饮点阵围剿</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#8a7a6a">集聚比值 0.354 · 中位 62.2m</text>
  <!-- 多店点阵 -->
  <g>
    <rect x="330" y="205" width="52" height="52" rx="8" fill="#c4a35a"/>
    <text x="356" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">店1</text>
    <rect x="420" y="205" width="52" height="52" rx="8" fill="#c4a35a"/>
    <text x="446" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">店2</text>
    <rect x="330" y="285" width="52" height="52" rx="8" fill="#c4a35a"/>
    <text x="356" y="315" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">店3</text>
    <rect x="420" y="285" width="52" height="52" rx="8" fill="#c4a35a"/>
    <text x="446" y="315" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">店4</text>
  </g>
  <text x="400" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#8b6914">同商圈多店对冲，出入口覆盖网</text>
  <text x="400" y="382" text-anchor="middle" font-size="10.5" fill="#8a7a6a">60m ≈ 步行视角转换临界节点</text>
  <rect x="308" y="405" width="185" height="48" rx="8" fill="#fcf8f2"/>
  <text x="400" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#8b6914">视觉注意力围剿</text>
  <text x="400" y="444" text-anchor="middle" font-size="10" fill="#8a7a6a">密度覆盖，不给你选择</text>

  <!-- ===== 机制3：重餐饮缓冲区 ===== -->
  <rect x="536" y="108" width="235" height="360" rx="12" fill="#ffffff" stroke="#c47a3a" stroke-width="2"/>
  <text x="653" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#a05a1e">③ 重餐饮缓冲区</text>
  <text x="653" y="158" text-anchor="middle" font-size="11" fill="#8a7a6a">集聚比值 0.490 · 中位 310m</text>
  <!-- 两个远距大店（以卡片中心653对称） -->
  <rect x="563" y="225" width="60" height="60" rx="10" fill="#c47a3a"/>
  <text x="593" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">A店</text>
  <text x="593" y="266" text-anchor="middle" font-size="8.5" fill="#fdf6f0">正餐</text>
  <rect x="683" y="225" width="60" height="60" rx="10" fill="#c47a3a"/>
  <text x="713" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B店</text>
  <text x="713" y="266" text-anchor="middle" font-size="8.5" fill="#fdf6f0">正餐</text>
  <line x1="628" y1="255" x2="678" y2="255" stroke="#c47a3a" stroke-width="2"/>
  <text x="653" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#a05a1e">300m</text>
  <text x="653" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#a05a1e">天然形成约300m物理缓冲带</text>
  <text x="653" y="362" text-anchor="middle" font-size="10.5" fill="#8a7a6a">目的性消费，愿为它专程前往</text>
  <rect x="561" y="405" width="185" height="48" rx="8" fill="#f8f3f0"/>
  <text x="653" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#a05a1e">半径内贴身开店=价格消耗战</text>
  <text x="653" y="444" text-anchor="middle" font-size="10" fill="#8a7a6a">拼目的地吸引力与品牌护城河</text>

  <!-- 底部规律 -->
  <rect x="40" y="486" width="720" height="44" rx="10" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="514" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8b6914">快餐 14m 贴身圈拼位置 ｜ 茶饮 60m 点阵拼密度 ｜ 重餐 300m 缓冲拼品牌</text>

  <!-- 脚注 -->
  <text x="400" y="532" text-anchor="middle" font-size="9.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 城市餐饮空间拓扑研究 · 2026.08 · 最近邻中位数距离 · 样本 N≈107,847</text>
</svg>
