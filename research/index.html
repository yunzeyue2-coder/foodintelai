<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>研究文章 · FoodIntelAI 食品决策库</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f5f0;font-family:'Inter','Noto Serif SC','PingFang SC','Microsoft YaHei',serif;color:#2a2218;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.page{max-width:760px;width:100%;padding:48px 40px 60px}
h1{font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:4px;letter-spacing:2px}
.sub{font-size:12px;color:#8a7a6a;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #e0ddd5;line-height:1.6}
/* 系列分组 */
.series{margin-bottom:32px}
.series-header{font-size:13px;font-weight:600;color:#8b6914;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e8e3db}
.series-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #e8e3db;border-radius:10px;padding:16px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:all .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.04);border-color:#c4a35a;transform:translateY(-2px)}
.card .day{font-size:10px;color:#c4a35a;letter-spacing:2px;margin-bottom:4px}
.card .title{font-size:14px;font-weight:600;color:#2a2218;margin-bottom:4px;line-height:1.4}
.card .desc{font-size:12px;color:#8a7a6a;line-height:1.6;flex:1}
.card.pending{opacity:.6;cursor:default;border-color:#e0ddd5}
.card.pending .day{color:#b5aaa0}
.card.pending .title{color:#8a7a6a}
.asset-card{background:linear-gradient(135deg,#faf8f5,#f5f0e8);border:1.5px solid #c4a35a;border-radius:10px;padding:16px 18px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;transition:all .2s;margin-bottom:10px}
.asset-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.04)}
.asset-card .ac-icon{font-size:28px;width:44px;text-align:center}
.asset-card .ac-info{flex:1}
.asset-card .ac-info .ac-name{font-size:14px;font-weight:600;color:#2a2218;margin-bottom:2px}
.asset-card .ac-info .ac-meta{font-size:11px;color:#8a7a6a;line-height:1.5}
.asset-card .ac-tag{font-size:10px;padding:3px 12px;border-radius:10px;background:#e8f0e8;color:#2a5a3a;white-space:nowrap}
.asset-card.gray .ac-tag{background:#f5f0e8;color:#8a7a6a}
.back{display:inline-block;margin-top:24px;font-size:12px;color:#8b6914;text-decoration:none;font-family:'Inter',sans-serif;letter-spacing:1px}
.back:hover{text-decoration:underline}
@media(max-width:640px){.page{padding:28px 16px 40px}.series-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
<h1>📖 研究文章</h1>
<div class="sub">FoodIntelAI 食品决策库 · 所有研究内容归档</div>

<div class="empty-state" style="text-align:center;padding:60px 20px;color:#b5aaa0">
<div style="font-size:36px;margin-bottom:12px">📄</div>
<div style="font-size:14px;margin-bottom:6px">研究内容整理中</div>
<div style="font-size:12px;color:#ccc">新文章即将上线</div>
</div>

<a href="../index.html" class="back">← 返回首页</a>
</div>
</body>
</html>
