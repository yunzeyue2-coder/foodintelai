<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景（深色黑金） -->
  <rect width="800" height="640" fill="#141518"/>

  <!-- 标题 -->
  <text x="400" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#c4a35a" letter-spacing="3">产业事实 · 数据速览</text>
  <line x1="330" y1="70" x2="470" y2="70" stroke="#c4a35a" stroke-width="2.5"/>

  <!-- 数据卡：2列 x 3行，卡片 340x120，间距 24 -->
  <!-- 卡1：34万家 全国米粉门店 -->
  <g>
    <rect x="30" y="100" width="360" height="130" rx="10" fill="#1e2229" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="55" y="150" font-size="32" font-weight="700" fill="#c4a35a">34<text font-size="13" fill="#8a7a6a">万家</text></text>
    <text x="55" y="182" font-size="13" fill="#e8e3db">全国米粉门店</text>
    <text x="55" y="206" font-size="10" fill="#6b7280">红餐大数据 · 2025.3</text>
  </g>
  <!-- 卡2：775亿 米粉市场规模 -->
  <g>
    <rect x="410" y="100" width="360" height="130" rx="10" fill="#1e2229" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="435" y="150" font-size="32" font-weight="700" fill="#c4a35a">775<text font-size="13" fill="#8a7a6a">亿元</text></text>
    <text x="435" y="182" font-size="13" fill="#e8e3db">米粉市场规模（同比+8.4%）</text>
    <text x="435" y="206" font-size="10" fill="#6b7280">红餐大数据 · 2024</text>
  </g>

  <!-- 卡3：759.6亿 柳州螺蛳粉全产业链 -->
  <g>
    <rect x="30" y="250" width="360" height="130" rx="10" fill="#1e2229" stroke="#c4a35a" stroke-width="2"/>
    <text x="55" y="300" font-size="32" font-weight="700" fill="#c4a35a">759.6<text font-size="13" fill="#8a7a6a">亿元</text></text>
    <text x="55" y="332" font-size="13" fill="#e8e3db">柳州螺蛳粉全产业链（同比+13.4%）</text>
    <text x="55" y="356" font-size="10" fill="#6b7280">柳州市商务局 · 2024，2025.1发布</text>
  </g>
  <!-- 卡4：4.9万家 柳州螺蛳粉实体店 -->
  <g>
    <rect x="410" y="250" width="360" height="130" rx="10" fill="#1e2229" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="435" y="300" font-size="32" font-weight="700" fill="#c4a35a">4.9<text font-size="13" fill="#8a7a6a">万家</text></text>
    <text x="435" y="332" font-size="13" fill="#e8e3db">柳州螺蛳粉实体店（全国）</text>
    <text x="435" y="356" font-size="10" fill="#6b7280">柳州市商务局 · 2024，2025.6报道</text>
  </g>

  <!-- 卡5：1700+家 蒙自源门店 -->
  <g>
    <rect x="30" y="400" width="360" height="130" rx="10" fill="#1e2229" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="55" y="450" font-size="32" font-weight="700" fill="#c4a35a">1,700<text font-size="13" fill="#8a7a6a">+家</text></text>
    <text x="55" y="482" font-size="13" fill="#e8e3db">蒙自源门店（或1,474家，口径冲突）</text>
    <text x="55" y="506" font-size="10" fill="#6b7280">21经济网/新华网引红餐 · 2024.11-2025.3</text>
  </g>
  <!-- 卡6：670+家 阿香米线 -->
  <g>
    <rect x="410" y="400" width="360" height="130" rx="10" fill="#1e2229" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="435" y="450" font-size="32" font-weight="700" fill="#c4a35a">670<text font-size="13" fill="#8a7a6a">+家</text></text>
    <text x="435" y="482" font-size="13" fill="#e8e3db">阿香米线门店</text>
    <text x="435" y="506" font-size="10" fill="#6b7280">21经济网 · 2024.11</text>
  </g>

  <!-- 底部注释 -->
  <text x="400" y="580" text-anchor="middle" font-size="10" fill="#6b7280" letter-spacing="0.5">头部米线品牌合计约2,000余家，占34万家门店的约千分之六</text>
  <text x="400" y="606" text-anchor="middle" font-size="10" fill="#5a5f6a" letter-spacing="0.5">FoodIntelAI 测算 · 2026</text>
</svg>
