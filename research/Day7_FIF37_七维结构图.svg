<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景（米色纸，与文章页一致） -->
  <rect width="800" height="660" fill="#f7f5f0"/>

  <!-- 标题 -->
  <text x="400" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#8b6914" letter-spacing="2">FIF-37 区域食品生态模型</text>
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">七个核心判断维度 —— 从不同侧面判断一个区域食品品类的产业演化状态</text>
  <line x1="340" y1="92" x2="460" y2="92" stroke="#c4a35a" stroke-width="3"/>

  <!-- 中心到各维度的连接线 -->
  <g stroke="#d8d2c4" stroke-width="1.8" stroke-dasharray="4,4">
    <line x1="400" y1="330" x2="400" y2="150"/>
    <line x1="400" y1="330" x2="550" y2="222"/>
    <line x1="400" y1="330" x2="588" y2="383"/>
    <line x1="400" y1="330" x2="480" y2="505"/>
    <line x1="400" y1="330" x2="320" y2="505"/>
    <line x1="400" y1="330" x2="212" y2="383"/>
    <line x1="400" y1="330" x2="250" y2="222"/>
  </g>

  <!-- 中心圆 -->
  <circle cx="400" cy="330" r="105" fill="#0B1F3A"/>
  <circle cx="400" cy="330" r="105" fill="none" stroke="#c4a35a" stroke-width="2.5"/>
  <text x="400" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#c4a35a" letter-spacing="2">FIF-006</text>
  <text x="400" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">区域食品生态</text>
  <text x="400" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">演化模型</text>

  <!-- 维度节点（7个，环形分布） -->
  <!-- 1 产业基础层（顶） -->
  <g>
    <rect x="330" y="108" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="400" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">产业基础层</text>
    <text x="400" y="164" text-anchor="middle" font-size="10" fill="#b5aaa0">INDUSTRIAL BASE</text>
  </g>
  <!-- 2 地域生态层（右上） -->
  <g>
    <rect x="480" y="188" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="550" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">地域生态层</text>
    <text x="550" y="244" text-anchor="middle" font-size="10" fill="#b5aaa0">REGIONAL ECOLOGY</text>
  </g>
  <!-- 3 产品形态层（右） -->
  <g>
    <rect x="522" y="349" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="592" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">产品形态层</text>
    <text x="592" y="405" text-anchor="middle" font-size="10" fill="#b5aaa0">PRODUCT ARCH.</text>
  </g>
  <!-- 4 技术工艺层（右下） -->
  <g>
    <rect x="410" y="471" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="480" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">技术工艺层</text>
    <text x="480" y="527" text-anchor="middle" font-size="10" fill="#b5aaa0">PROCESS BARRIER</text>
  </g>
  <!-- 5 风味资产层（左下） -->
  <g>
    <rect x="250" y="471" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="320" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">风味资产层</text>
    <text x="320" y="527" text-anchor="middle" font-size="10" fill="#b5aaa0">FLAVOR ASSET</text>
  </g>
  <!-- 6 交付系统层（左） -->
  <g>
    <rect x="138" y="349" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="208" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">交付系统层</text>
    <text x="208" y="405" text-anchor="middle" font-size="10" fill="#b5aaa0">DELIVERY SYSTEM</text>
  </g>
  <!-- 7 全国化层（左上） -->
  <g>
    <rect x="180" y="188" width="140" height="70" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
    <text x="250" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">全国化层</text>
    <text x="250" y="244" text-anchor="middle" font-size="10" fill="#b5aaa0">SCALING</text>
  </g>

  <!-- 底部：原则条 -->
  <rect x="40" y="575" width="720" height="52" rx="12" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="606" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b6914" letter-spacing="1">证据优先：有充分数据支撑的变量才进入量化分析，证据不足的不制造虚假精确</text>

  <!-- 脚注 -->
  <text x="400" y="646" text-anchor="middle" font-size="10.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 区域食品生态模型 V1.0 · 2026.08</text>
</svg>
