<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="420" fill="#f7f5f0"/>

  <!-- 标题 -->
  <text x="400" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#8b6914" letter-spacing="3">从一家店，到一个产业</text>
  <line x1="330" y1="66" x2="470" y2="66" stroke="#c4a35a" stroke-width="3"/>

  <!-- 左：一家店的经营逻辑 -->
  <g>
    <rect x="40" y="100" width="310" height="280" rx="12" fill="#ffffff" stroke="#d4c8b0" stroke-width="2"/>
    <text x="195" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2218">一家店的经营逻辑</text>
    <!-- 链条节点 -->
    <g>
      <rect x="90" y="155" width="210" height="42" rx="8" fill="#f5efe3" stroke="#c4a35a" stroke-width="1.5"/>
      <text x="195" y="182" text-anchor="middle" font-size="12" fill="#5a4a3a">店 —— 厨师的手艺</text>
    </g>
    <g>
      <rect x="90" y="210" width="210" height="42" rx="8" fill="#f5efe3" stroke="#c4a35a" stroke-width="1.5"/>
      <text x="195" y="237" text-anchor="middle" font-size="12" fill="#5a4a3a">产品 —— 一道菜</text>
    </g>
    <g>
      <rect x="90" y="265" width="210" height="42" rx="8" fill="#f5efe3" stroke="#c4a35a" stroke-width="1.5"/>
      <text x="195" y="292" text-anchor="middle" font-size="12" fill="#5a4a3a">顾客 —— 周边的人</text>
    </g>
    <g>
      <rect x="90" y="320" width="210" height="42" rx="8" fill="#f5efe3" stroke="#c4a35a" stroke-width="1.5"/>
      <text x="195" y="347" text-anchor="middle" font-size="12" fill="#5a4a3a">生意 —— 做一单算一单</text>
    </g>
  </g>

  <!-- 中间箭头 -->
  <text x="400" y="245" text-anchor="middle" font-size="30" font-weight="700" fill="#8b6914">→</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#8a7a6a" letter-spacing="1">经营逻辑</text>
  <text x="400" y="302" text-anchor="middle" font-size="11" fill="#8a7a6a" letter-spacing="1">⇣</text>
  <text x="400" y="324" text-anchor="middle" font-size="11" fill="#8a7a6a" letter-spacing="1">产业逻辑</text>

  <!-- 右：一个产业的运行逻辑 -->
  <g>
    <rect x="450" y="100" width="310" height="280" rx="12" fill="#141518" stroke="#c4a35a" stroke-width="2"/>
    <text x="605" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#c4a35a">一个产业的运行逻辑</text>
    <g>
      <rect x="500" y="155" width="210" height="42" rx="8" fill="#1e2229" stroke="#3a3d46" stroke-width="1.5"/>
      <text x="605" y="182" text-anchor="middle" font-size="12" fill="#e8e3db">供应链 —— 离开原产地独立运转</text>
    </g>
    <g>
      <rect x="500" y="210" width="210" height="42" rx="8" fill="#1e2229" stroke="#3a3d46" stroke-width="1.5"/>
      <text x="605" y="237" text-anchor="middle" font-size="12" fill="#e8e3db">产品 —— 在新场景重新站住</text>
    </g>
    <g>
      <rect x="500" y="265" width="210" height="42" rx="8" fill="#1e2229" stroke="#3a3d46" stroke-width="1.5"/>
      <text x="605" y="292" text-anchor="middle" font-size="12" fill="#e8e3db">认知 —— 脱离地域标签独立生长</text>
    </g>
    <g>
      <rect x="500" y="320" width="210" height="42" rx="8" fill="#1e2229" stroke="#c4a35a" stroke-width="1.5"/>
      <text x="605" y="347" text-anchor="middle" font-size="12" fill="#c4a35a">体系 —— 三个半径同时站住</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#8a7a6a" letter-spacing="0.5">全国化的本质：把"一家店的经营逻辑"换成"一个产业的运行逻辑"</text>
</svg>
