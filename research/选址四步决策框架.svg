<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="560" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914" letter-spacing="2">选址四步决策框架</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">从商圈到动线：四步逐层收紧，确定铺位是否值得进</text>
  <line x1="330" y1="86" x2="470" y2="86" stroke="#c4a35a" stroke-width="3"/>

  <!-- 第一步：商圈多样性 -->
  <rect x="140" y="110" width="520" height="82" rx="12" fill="#ffffff" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="140" y="110" width="120" height="82" rx="12" fill="#0B1F3A"/>
  <text x="200" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">第一步</text>
  <text x="200" y="170" text-anchor="middle" font-size="11" fill="#c4a35a">STEP 01</text>
  <text x="280" y="138" font-size="15" font-weight="700" fill="#1a1a1a">核算商圈品类多样性指数</text>
  <text x="280" y="162" font-size="12.5" fill="#3a322a">统计周边 1km 内餐饮 POI 品类占比，计算多样性指数</text>
  <text x="280" y="182" font-size="11.5" fill="#8b6914">→ 匹配品类客单价与溢价空间（指数≥4.0 可做非标，&lt;3.6 谨慎高客单）</text>

  <!-- 箭头 -->
  <text x="400" y="210" text-anchor="middle" font-size="16" fill="#8b6914">▼</text>

  <!-- 第二步：最近邻距离 -->
  <rect x="140" y="222" width="520" height="82" rx="12" fill="#ffffff" stroke="#c4a35a" stroke-width="2"/>
  <rect x="140" y="222" width="120" height="82" rx="12" fill="#c4a35a"/>
  <text x="200" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">第二步</text>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#f5f0e8">STEP 02</text>
  <text x="280" y="250" font-size="15" font-weight="700" fill="#1a1a1a">测算同品类最近邻距离</text>
  <text x="280" y="274" font-size="12.5" fill="#3a322a">从拟选铺位到最近同品类竞品的实际距离</text>
  <text x="280" y="294" font-size="11.5" fill="#8b6914">→ 确定贴身区间（&lt;30m）或缓冲区间（&gt;300m）</text>

  <!-- 箭头 -->
  <text x="400" y="322" text-anchor="middle" font-size="16" fill="#8b6914">▼</text>

  <!-- 第三步：热力聚类核心 -->
  <rect x="140" y="334" width="520" height="82" rx="12" fill="#ffffff" stroke="#3A8D5D" stroke-width="2"/>
  <rect x="140" y="334" width="120" height="82" rx="12" fill="#3A8D5D"/>
  <text x="200" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">第三步</text>
  <text x="200" y="394" text-anchor="middle" font-size="11" fill="#e8f4e8">STEP 03</text>
  <text x="280" y="362" font-size="15" font-weight="700" fill="#1a1a1a">校对热力聚类核心</text>
  <text x="280" y="386" font-size="12.5" fill="#3a322a">判断铺位是否处于全城主要聚类核心或辐射范围</text>
  <text x="280" y="406" font-size="11.5" fill="#2a5a3a">→ 核心边缘付稍高租金，优于落户"地理死角"</text>

  <!-- 箭头 -->
  <text x="400" y="434" text-anchor="middle" font-size="16" fill="#8b6914">▼</text>

  <!-- 第四步：微观动线 -->
  <rect x="140" y="446" width="520" height="82" rx="12" fill="#ffffff" stroke="#c47a3a" stroke-width="2"/>
  <rect x="140" y="446" width="120" height="82" rx="12" fill="#c47a3a"/>
  <text x="200" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">第四步</text>
  <text x="200" y="506" text-anchor="middle" font-size="11" fill="#fdf6f0">STEP 04</text>
  <text x="280" y="474" font-size="15" font-weight="700" fill="#1a1a1a">微观动线截留评估</text>
  <text x="280" y="498" font-size="12.5" fill="#3a322a">站在客流出口实测视线阻隔与拐角数量</text>
  <text x="280" y="518" font-size="11.5" fill="#a05a1e">→ 评估角位价值与 50 米内曝光条件，定租金折价</text>

  <!-- 脚注 -->
  <text x="400" y="552" text-anchor="middle" font-size="10" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 城市餐饮空间拓扑研究 · 2026.08 · 四步递进，缺一步都可能选错铺</text>
</svg>
