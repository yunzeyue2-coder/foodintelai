<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="880" fill="#f7f5f0"/>

  <!-- 标题 -->
  <text x="400" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6914" letter-spacing="3">反例证据墙</text>
  <line x1="340" y1="68" x2="460" y2="68" stroke="#c4a35a" stroke-width="3"/>
  <text x="400" y="94" text-anchor="middle" font-size="10" fill="#8a7a6a" letter-spacing="1">局部机制走通 ≠ 全流程走通 —— 四个品类，没有一条三条半径同时站稳</text>

  <!-- ========== 组1：螺蛳粉 预包装 vs 实体店 ========== -->
  <g>
    <rect x="40" y="120" width="720" height="200" rx="12" fill="#ffffff" stroke="#e8e3db" stroke-width="1.5"/>
    <text x="70" y="155" font-size="10" font-weight="700" fill="#2a2218">螺蛳粉：跑出广西的是"袋装"，不是堂食</text>
    <!-- 条形：预包装 169亿 vs 实体店 396.9亿（按比例：396.9→380px，169→162px） -->
    <text x="70" y="195" font-size="10" fill="#8a7a6a">预包装</text>
    <rect x="70" y="205" width="162" height="22" rx="4" fill="#c4a35a"/>
    <text x="242" y="222" font-size="12" font-weight="700" fill="#2a2218">169 亿元</text>
    <text x="70" y="265" font-size="10" fill="#8a7a6a">实体店</text>
    <rect x="70" y="275" width="380" height="22" rx="4" fill="#8b6914"/>
    <text x="460" y="292" font-size="12" font-weight="700" fill="#2a2218">396.9 亿元（堂食仍以本地为主）</text>
  </g>

  <!-- ========== 组2：沙县 8.8万 vs 认证4000 ========== -->
  <g>
    <rect x="40" y="340" width="720" height="200" rx="12" fill="#ffffff" stroke="#e8e3db" stroke-width="1.5"/>
    <text x="70" y="375" font-size="10" font-weight="700" fill="#2a2218">沙县：品类火了，企业没跟上</text>
    <!-- 大小对比：圆 vs 小点 -->
    <circle cx="230" cy="475" r="72" fill="#f5efe3" stroke="#c4a35a" stroke-width="3"/>
    <text x="230" y="465" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914">8.8万</text>
    <text x="230" y="495" text-anchor="middle" font-size="10" fill="#8a7a6a">总门店</text>
    <circle cx="560" cy="475" r="16" fill="#8b6914"/>
    <text x="560" y="445" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6914">约4000</text>
    <text x="560" y="505" text-anchor="middle" font-size="10" fill="#8a7a6a">认证加盟店（占比不到5%）</text>
  </g>

  <!-- ========== 组3：兰州面 5万家 vs 连锁化32% ========== -->
  <g>
    <rect x="40" y="560" width="720" height="200" rx="12" fill="#ffffff" stroke="#e8e3db" stroke-width="1.5"/>
    <text x="70" y="595" font-size="10" font-weight="700" fill="#2a2218">兰州牛肉面：认知铺满全国，行业仍是散店</text>
    <!-- 甜甜圈：32% 填充（circle + stroke-dasharray，兼容性好） -->
    <circle cx="220" cy="690" r="58" fill="none" stroke="#eee9df" stroke-width="26"/>
    <circle cx="220" cy="690" r="58" fill="none" stroke="#8b6914" stroke-width="26" stroke-dasharray="116.6 247.8" stroke-linecap="butt" transform="rotate(-90 220 690)"/>
    <text x="220" y="686" text-anchor="middle" font-size="19" font-weight="700" fill="#8b6914">32%</text>
    <text x="220" y="716" text-anchor="middle" font-size="10" fill="#8a7a6a">连锁化率</text>
    <text x="330" y="680" font-size="10" fill="#2a2218">全国门店超 <text font-size="19" font-weight="700" fill="#8b6914">5万家</text></text>
    <text x="330" y="710" font-size="10" fill="#8a7a6a">但约三分之二仍是独立经营门店</text>
    <text x="330" y="738" font-size="10" fill="#b5aaa0">连锁化率32%为甘肃行业协会口径，建议交叉验证</text>
  </g>

  <!-- 底部结论 -->
  <rect x="40" y="780" width="720" height="70" rx="12" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="816" text-anchor="middle" font-size="10" font-weight="700" fill="#8b6914" letter-spacing="1">这不是个例，是普遍规律——三重半径里任何一条单点突破，都推不到终点</text>
</svg>
