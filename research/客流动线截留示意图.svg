<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="460" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914" letter-spacing="2">主客流动线 · 近场拦截示意图</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">动线衰减与位置价值：距离决定曝光，位置决定截留</text>
  <line x1="330" y1="86" x2="470" y2="86" stroke="#c4a35a" stroke-width="3"/>

  <!-- 主客流动线（横向） -->
  <!-- 动线轨道 -->
  <rect x="60" y="140" width="680" height="10" rx="5" fill="#d8d2c4"/>
  <!-- 起点：地铁出口 -->
  <rect x="40" y="118" width="110" height="54" rx="10" fill="#0B1F3A"/>
  <text x="95" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">地铁出口</text>
  <text x="95" y="162" text-anchor="middle" font-size="10" fill="#c4a35a">客流起点 · 0m</text>
  <!-- 终点：写字楼大堂 -->
  <rect x="650" y="118" width="130" height="54" rx="10" fill="#0B1F3A"/>
  <text x="715" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">写字楼大堂</text>
  <text x="715" y="162" text-anchor="middle" font-size="10" fill="#c4a35a">客流终点 · &gt;50m</text>
  <!-- 动线方向箭头 -->
  <polygon points="740,145 726,138 726,152" fill="#0B1F3A"/>

  <!-- 衰减刻度 -->
  <text x="170" y="170" text-anchor="middle" font-size="10" fill="#b5aaa0">0m</text>
  <text x="310" y="170" text-anchor="middle" font-size="10" fill="#b5aaa0">20m</text>
  <text x="470" y="170" text-anchor="middle" font-size="10" fill="#b5aaa0">50m</text>
  <line x1="170" y1="162" x2="170" y2="150" stroke="#d8d2c4"/>
  <line x1="310" y1="162" x2="310" y2="150" stroke="#d8d2c4"/>
  <line x1="470" y1="162" x2="470" y2="150" stroke="#d8d2c4"/>

  <!-- 店铺 A：角位/第一视觉点（绿） -->
  <rect x="130" y="200" width="160" height="80" rx="12" fill="#e8f4e8" stroke="#3A8D5D" stroke-width="2"/>
  <text x="210" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#2a5a3a">店铺 A · 角位</text>
  <text x="210" y="252" text-anchor="middle" font-size="12" fill="#3a322a">第一视觉点</text>
  <text x="210" y="272" text-anchor="middle" font-size="11" fill="#2a5a3a">✓ 理论截留优势显著</text>
  <rect x="140" y="290" width="140" height="30" rx="8" fill="#3A8D5D"/>
  <text x="210" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">快餐/饮品贴身区 &lt;15m</text>
  <!-- 动线连接到 A -->
  <line x1="170" y1="150" x2="170" y2="200" stroke="#3A8D5D" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 店铺 B：平街中间铺（黄） -->
  <rect x="330" y="200" width="160" height="80" rx="12" fill="#fcf8f2" stroke="#c4a35a" stroke-width="2"/>
  <text x="410" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914">店铺 B · 平街中间</text>
  <text x="410" y="252" text-anchor="middle" font-size="12" fill="#3a322a">动线中段</text>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#8b6914">△ 曝光衰减</text>
  <rect x="340" y="290" width="140" height="30" rx="8" fill="#c4a35a"/>
  <text x="410" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">偏离主动线 20-50m</text>
  <line x1="330" y1="150" x2="330" y2="200" stroke="#c4a35a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 店铺 C：马路对侧/阴面铺（红） -->
  <rect x="530" y="200" width="160" height="80" rx="12" fill="#f8f3f0" stroke="#c47a3a" stroke-width="2"/>
  <text x="610" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#a05a1e">店铺 C · 马路对侧</text>
  <text x="610" y="252" text-anchor="middle" font-size="12" fill="#3a322a">阴面铺 · 高阻隔</text>
  <text x="610" y="272" text-anchor="middle" font-size="11" fill="#a05a1e">✕ 高物理阻隔风险</text>
  <rect x="540" y="290" width="140" height="30" rx="8" fill="#c47a3a"/>
  <text x="610" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">偏离 &gt;50m · 需租金折价</text>
  <line x1="470" y1="150" x2="470" y2="200" stroke="#c47a3a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 底部规律 -->
  <rect x="60" y="350" width="680" height="52" rx="10" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#8b6914">曝光价值：A（0-20m 高曝光）＞ B（20-50m 衰减）＞ C（&gt;50m 高阻隔）</text>
  <text x="400" y="394" text-anchor="middle" font-size="11.5" fill="#8a7a6a">角位铺物理视觉曝光面积是单面街铺的数倍 —— 位置决定客流初始条件</text>

  <!-- 脚注 -->
  <text x="400" y="432" text-anchor="middle" font-size="10" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 城市餐饮空间拓扑研究 · 2026.08 · 距离模型为行为假设，需实地验证</text>
</svg>
