<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="620" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#8b6914" letter-spacing="2">城市餐饮三层供给结构</text>
  <text x="400" y="80" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">线上POI结构性样本 · 10万级餐饮供给 · 覆盖80.7%</text>
  <line x1="330" y1="94" x2="470" y2="94" stroke="#c4a35a" stroke-width="3"/>

  <!-- 第三层 体验消费层（顶部，最小） -->
  <polygon points="320,120 480,120 500,190 300,190" fill="#3A8D5D" opacity="0.92"/>
  <text x="400" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">体验消费层</text>
  <text x="400" y="173" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.92">9.6% · 10,429家 · 中位 ¥31</text>

  <!-- 第二层 社交消费层（中部） -->
  <polygon points="300,214 500,214 545,320 255,320" fill="#0B1F3A" opacity="0.92"/>
  <text x="400" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">社交消费层</text>
  <text x="400" y="286" text-anchor="middle" font-size="12.5" fill="#c4a35a">17.5% · 18,947家 · 中位 ¥43</text>

  <!-- 第一层 高频刚需层（底部，最大） -->
  <polygon points="255,344 545,344 600,470 200,470" fill="#8b6914" opacity="0.92"/>
  <text x="400" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">高频刚需层</text>
  <text x="400" y="425" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.92">53.6% · 58,067家 · 中位 ¥16</text>

  <!-- 判断条 -->
  <rect x="60" y="500" width="680" height="66" rx="12" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b6914">从线上供给结构看，这是一座高频快餐型供给占比较高的城市</text>
  <text x="400" y="554" text-anchor="middle" font-size="12" fill="#8a7a6a">一半以上的餐饮供给集中在 20 元左右及以下的高频消费场景</text>

  <!-- 脚注 -->
  <text x="400" y="596" text-anchor="middle" font-size="10.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 城市餐饮研究系列 · 第1篇 · 2026.08</text>
</svg>
