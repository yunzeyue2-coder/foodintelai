<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" width="800" height="770" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景（米色纸，与文章页一致） -->
  <rect width="800" height="770" fill="#f7f5f0"/>

  <!-- 标题 -->
  <text x="400" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#8b6914" letter-spacing="2">全国化三重约束模型</text>
  <text x="400" y="82" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">三个半径同时成立 —— 不是接力赛，是三张考卷同时交卷</text>
  <line x1="340" y1="94" x2="460" y2="94" stroke="#c4a35a" stroke-width="3"/>

  <!-- 三角形框架：顶点(400,205) 底边(215,480)-(585,480) -->
  <polygon points="400,205 215,480 585,480" fill="none" stroke="#c4a35a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 对称轴虚线（重心参考） -->
  <line x1="400" y1="205" x2="400" y2="480" stroke="#d8d2c4" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- 中心：全国化胶囊 -->
  <rect x="300" y="358" width="200" height="60" rx="30" fill="#8b6914"/>
  <text x="400" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="4">全国化</text>
  <text x="400" y="330" text-anchor="middle" font-size="12.5" fill="#8a7a6a">三个顶点同时站住</text>
  <text x="400" y="446" text-anchor="middle" font-size="12.5" fill="#8a7a6a">任一顶点塌了 → 停在“地方流行”</text>

  <!-- 顶节点：认知半径 -->
  <g>
    <circle cx="400" cy="205" r="76" fill="#ffffff" stroke="#c4a35a" stroke-width="2.5"/>
    <text x="400" y="194" text-anchor="middle" font-size="20" font-weight="700" fill="#8b6914" letter-spacing="1">认知半径</text>
    <text x="400" y="222" text-anchor="middle" font-size="12.5" fill="#8a7a6a">凭什么买</text>
    <text x="400" y="246" text-anchor="middle" font-size="10.5" fill="#b5aaa0">= 消费认知一致性</text>
  </g>

  <!-- 左节点：物理半径 -->
  <g>
    <circle cx="215" cy="480" r="76" fill="#ffffff" stroke="#c4a35a" stroke-width="2.5"/>
    <text x="215" y="469" text-anchor="middle" font-size="20" font-weight="700" fill="#8b6914" letter-spacing="1">物理半径</text>
    <text x="215" y="497" text-anchor="middle" font-size="12.5" fill="#8a7a6a">运得出吗</text>
    <text x="215" y="521" text-anchor="middle" font-size="10.5" fill="#b5aaa0">= 标准化程度</text>
  </g>

  <!-- 右节点：味觉半径 -->
  <g>
    <circle cx="585" cy="480" r="76" fill="#ffffff" stroke="#c4a35a" stroke-width="2.5"/>
    <text x="585" y="469" text-anchor="middle" font-size="20" font-weight="700" fill="#8b6914" letter-spacing="1">味觉半径</text>
    <text x="585" y="497" text-anchor="middle" font-size="12.5" fill="#8a7a6a">吃得惯吗</text>
    <text x="585" y="521" text-anchor="middle" font-size="10.5" fill="#b5aaa0">= 本篇新补充</text>
  </g>

  <!-- 底部：半路卡住状态条 -->
  <rect x="40" y="575" width="720" height="88" rx="12" fill="#ffffff" stroke="#e8e3db" stroke-width="1.5"/>
  <text x="70" y="603" font-size="14" font-weight="700" fill="#2a2218">半路卡住的品类，不是三条全没过</text>
  <text x="70" y="633" font-size="12.5" fill="#5a4a3a">而是已经够到了一两条，剩下那条一直补不齐 —— 差的往往卡在“味道站不站得住”</text>
  <!-- 状态点：●●○ 表示够到两条、差一条 -->
  <circle cx="648" cy="633" r="7" fill="#8b6914"/>
  <circle cx="674" cy="633" r="7" fill="#8b6914"/>
  <circle cx="700" cy="633" r="7" fill="none" stroke="#8b6914" stroke-width="2"/>

  <!-- 底部：结论条 -->
  <rect x="40" y="679" width="720" height="60" rx="12" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="714" text-anchor="middle" font-size="15" font-weight="700" fill="#8b6914" letter-spacing="1">三个顶点同时站住，地方食品才真正走进全国市场</text>

  <!-- 脚注 -->
  <text x="400" y="756" text-anchor="middle" font-size="10.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 第一研究季 · 中国米线产业研究 · Day6</text>
</svg>
