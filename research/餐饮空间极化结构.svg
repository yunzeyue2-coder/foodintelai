<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6914" letter-spacing="2">餐饮空间极化结构</text>
  <text x="400" y="72" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">少数区域吸纳四分之一门店，大量外围处于低密度 —— 警惕"伪空白区"</text>
  <line x1="330" y1="86" x2="470" y2="86" stroke="#c4a35a" stroke-width="3"/>

  <!-- 左：核心聚类区 -->
  <rect x="50" y="110" width="330" height="230" rx="12" fill="#ffffff" stroke="#3A8D5D" stroke-width="2"/>
  <text x="215" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#2a5a3a">核心聚类区</text>
  <text x="215" y="163" text-anchor="middle" font-size="12" fill="#8a7a6a">60 个聚类核 · 超高密度</text>
  <!-- 密集点阵 -->
  <g fill="#3A8D5D" opacity="0.85">
    <circle cx="140" cy="195" r="6"/><circle cx="170" cy="190" r="5"/><circle cx="200" cy="198" r="6"/>
    <circle cx="230" cy="192" r="5"/><circle cx="260" cy="197" r="6"/><circle cx="290" cy="190" r="5"/>
    <circle cx="150" cy="225" r="6"/><circle cx="185" cy="228" r="5"/><circle cx="220" cy="222" r="6"/>
    <circle cx="255" cy="227" r="5"/><circle cx="285" cy="223" r="6"/><circle cx="165" cy="255" r="5"/>
    <circle cx="200" cy="258" r="6"/><circle cx="235" cy="252" r="5"/><circle cx="270" cy="256" r="6"/>
  </g>
  <text x="215" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#2a5a3a">26,343 家 · 24.4%</text>
  <text x="215" y="318" text-anchor="middle" font-size="11" fill="#8a7a6a">密度 &gt; 1,500 家/平方公里</text>

  <!-- 右：离散与外围区 -->
  <rect x="420" y="110" width="330" height="230" rx="12" fill="#ffffff" stroke="#c47a3a" stroke-width="2"/>
  <text x="585" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#a05a1e">离散与外围区</text>
  <text x="585" y="163" text-anchor="middle" font-size="12" fill="#8a7a6a">广域低密度分布</text>
  <!-- 稀疏点 -->
  <g fill="#c47a3a" opacity="0.5">
    <circle cx="500" cy="195" r="6"/><circle cx="580" cy="200" r="5"/><circle cx="660" cy="192" r="6"/>
    <circle cx="530" cy="240" r="5"/><circle cx="620" cy="245" r="6"/><circle cx="550" cy="270" r="5"/>
  </g>
  <text x="585" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#a05a1e">81,504 家 · 75.6%</text>
  <text x="585" y="318" text-anchor="middle" font-size="11" fill="#8a7a6a">密度 &lt; 200 家/平方公里</text>

  <!-- 中间对比箭头 -->
  <text x="395" y="200" text-anchor="middle" font-size="20" fill="#8b6914">⇄</text>
  <text x="395" y="225" text-anchor="middle" font-size="10" fill="#b5aaa0">核心集中</text>
  <text x="395" y="240" text-anchor="middle" font-size="10" fill="#b5aaa0">vs</text>
  <text x="395" y="255" text-anchor="middle" font-size="10" fill="#b5aaa0">外围分散</text>

  <!-- 头部聚类核 -->
  <rect x="50" y="360" width="700" height="100" rx="12" fill="#faf8f5" stroke="#e8e3db"/>
  <text x="70" y="386" font-size="12" font-weight="700" fill="#1a1a1a">头部空间极化核（门店数）</text>
  <!-- Cluster 0 -->
  <rect x="70" y="400" width="160" height="44" rx="8" fill="#0B1F3A"/>
  <text x="150" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Cluster 0</text>
  <text x="150" y="436" text-anchor="middle" font-size="10" fill="#c4a35a">2,227 家 · 4,454/km²</text>
  <!-- Cluster 5 -->
  <rect x="245" y="400" width="150" height="44" rx="8" fill="#fcf8f2" stroke="#c4a35a"/>
  <text x="320" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#8b6914">Cluster 5</text>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#8a7a6a">1,214 家</text>
  <!-- Cluster 11 -->
  <rect x="410" y="400" width="150" height="44" rx="8" fill="#fcf8f2" stroke="#c4a35a"/>
  <text x="485" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#8b6914">Cluster 11</text>
  <text x="485" y="436" text-anchor="middle" font-size="10" fill="#8a7a6a">1,173 家</text>
  <!-- Cluster 9 -->
  <rect x="575" y="400" width="150" height="44" rx="8" fill="#fcf8f2" stroke="#c4a35a"/>
  <text x="650" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#8b6914">Cluster 9</text>
  <text x="650" y="436" text-anchor="middle" font-size="10" fill="#8a7a6a">1,072 家</text>

  <!-- 底部洞察 -->
  <rect x="50" y="470" width="700" height="26" rx="8" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="400" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#8b6914">⚠️ 盲目开拓外围"空白"= 高独立引流成本，可能不是蓝海而是"客流物理串联失效区"</text>
</svg>
