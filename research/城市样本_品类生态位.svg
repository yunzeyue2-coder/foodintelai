<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="640" fill="#f7f5f0"/>
  <!-- 标题 -->
  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#8b6914" letter-spacing="2">品类生态位三档结构</text>
  <text x="400" y="80" text-anchor="middle" font-size="13" fill="#8a7a6a" letter-spacing="0.5">有效品牌化比例 · 已区分地域公共名号与品类名干扰</text>
  <line x1="330" y1="94" x2="470" y2="94" stroke="#c4a35a" stroke-width="3"/>

  <!-- 第一档 已品牌化端 -->
  <rect x="50" y="120" width="700" height="120" rx="10" fill="#f0f7f0" stroke="#3A8D5D" stroke-width="1.5"/>
  <rect x="50" y="120" width="700" height="120" rx="10" fill="none" stroke="#3A8D5D" stroke-width="1.5"/>
  <text x="75" y="148" font-size="13" font-weight="700" fill="#2a5a3a" letter-spacing="1">已品牌化端 · 40%+</text>
  <text x="75" y="176" font-size="14" fill="#3a322a">咖啡 48.3%</text>
  <text x="310" y="176" font-size="14" fill="#3a322a">奶茶 42.3%</text>
  <text x="560" y="176" font-size="14" fill="#3a322a">西式快餐 40.2%</text>
  <text x="75" y="206" font-size="11.5" fill="#8a7a6a">统一供应链 + 统一管控 + 标准化程度高 → 规模可复制</text>
  <text x="75" y="228" font-size="11.5" fill="#8a7a6a">这类品类竞争的主战场在供应链效率与点位密度</text>

  <!-- 第二档 中间带 -->
  <rect x="50" y="258" width="700" height="150" rx="10" fill="#fcf8f2" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="75" y="286" font-size="13" font-weight="700" fill="#8b6914" letter-spacing="1">中间带 · 3%-9%：有品牌进入，远未饱和</text>
  <text x="75" y="316" font-size="14" fill="#3a322a">麻辣烫 9.0%</text>
  <text x="270" y="316" font-size="14" fill="#3a322a">卤味 8.3%</text>
  <text x="450" y="316" font-size="14" fill="#3a322a">米线 5.1%</text>
  <text x="75" y="344" font-size="14" fill="#3a322a">炸鸡 4.9%</text>
  <text x="270" y="344" font-size="14" fill="#3a322a">胡辣汤 3.3%</text>
  <text x="75" y="380" font-size="11.5" fill="#8a7a6a">已有头部品牌证明品类可以连锁化，但渗透率仍低 —— 品牌化进程中的品类</text>
  <text x="75" y="398" font-size="11.5" fill="#8a7a6a">代表：卤味已跑通连锁模型（8.3%），距离40%+仍有很大空间</text>

  <!-- 第三档 未品牌化端 -->
  <rect x="50" y="426" width="700" height="150" rx="10" fill="#f8f3f0" stroke="#c47a3a" stroke-width="1.5"/>
  <text x="75" y="454" font-size="13" font-weight="700" fill="#a05a1e" letter-spacing="1">未品牌化端 · &lt;2%：有品类无品牌</text>
  <text x="75" y="484" font-size="14" fill="#3a322a">烧烤 2.0%</text>
  <text x="270" y="484" font-size="14" fill="#3a322a">火锅 1.8%</text>
  <text x="450" y="484" font-size="14" fill="#3a322a">面食 1.1%</text>
  <text x="75" y="512" font-size="14" fill="#3a322a">豫菜 0.1%</text>
  <text x="75" y="548" font-size="11.5" fill="#8a7a6a">需求巨大但品牌化极低 —— 是"没人做"还是"做不了"，需用三分法判断</text>
  <text x="75" y="566" font-size="11.5" fill="#8a7a6a">（组织化能力未进 / 标准化受限 / 消费心智偏好非品牌化）</text>

  <!-- 脚注 -->
  <text x="400" y="612" text-anchor="middle" font-size="10.5" fill="#b5aaa0" letter-spacing="0.5">FoodIntelAI · 城市餐饮研究系列 · 第1篇 · 2026.08 · 数据可反查</text>
</svg>
