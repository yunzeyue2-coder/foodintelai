<p><b>这个页面暂时下线。</b>原因：它原本是「成本 → 定价 → 盈亏」三步流程里的第三步，单独打开时会用内置的示例参数计算，算出来的保本单量和利润是错的（实测：保本 70 件/月，正确值应为约 2,089 件/月）。</p>
