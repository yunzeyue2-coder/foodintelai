<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>foodintel AI | 食品工业知识库 · canglin1985</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-icon.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon.svg">
<meta name="theme-color" content="#f0e9e2">
<meta name="msapplication-TileColor" content="#f0e9e2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 内联 favicon 预加载：让浏览器尽早开始渲染 */
html{background:#f0e9e2}
</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f0e9e2;
  --card:#faf8f5;
  --text:#1a1a1a;
  --muted:#7a7269;
  --light:#b5aaa0;
  --accent:#C0392B;
  --accent-light:#E8652D;
  --green:#07C160;
  --border:#ddd4ca;
  --tag-bg:#e8dfd5;
  --radius:14px;
  --shadow:0 2px 12px rgba(0,0,0,.04);
  --font-lg:17px;
  --font-md:14px;
  --font-sm:12px;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  width:100%;
}

/* ===== 导航 ===== */
.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(240,233,226,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
}
.nav-inner{
  max-width:720px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:52px;
}
.nav-brand{font-size:18px;font-weight:700;color:var(--accent)}
.nav-links{display:flex;gap:4px}
.nav-links a{
  padding:6px 12px;
  font-size:12px;
  color:var(--muted);
  text-decoration:none;
  border-radius:6px;
  transition:.2s;
}
.nav-links a:hover{background:var(--tag-bg);color:var(--text)}

@media(max-width:400px){
  .nav-links a{padding:6px 6px}
}

/* ===== 搜索栏 ===== */
.nav-search{
  max-width:720px;
  margin:0 auto;
  padding:0 16px 12px;
}
.nav-search input{
  width:100%;
  padding:10px 16px;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:14px;
  background:var(--card);
  color:var(--text);
  outline:none;
  transition:.2s;
}
.nav-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,57,43,.08)}
.nav-search input::placeholder{color:var(--light)}

/* ===== 英雄区 ===== */
.hero{
  padding:48px 20px 36px;
  text-align:center;
  background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);
}
.hero-badge{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  font-size:10px;
  padding:3px 10px;
  border-radius:4px;
  letter-spacing:1.5px;
  margin-bottom:16px;
}
.hero-sub{
  font-size:14px;
  color:var(--muted);
  max-width:480px;
  margin:0 auto 20px;
  line-height:1.7;
}
.hero-stats{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.hero-stat{
  background:var(--card);
  padding:10px 18px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-width:80px;
}
.hero-stat .num{
  font-size:20px;
  font-weight:800;
  color:var(--accent-light);
}
.hero-stat .lb{font-size:10px;color:var(--muted);margin-top:1px}
.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--green);
  color:#fff;
  padding:13px 32px;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}
.hero-cta:hover{background:#06AD56;transform:translateY(-1px)}
.hero-cta-sub{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:10px;
}

/* ===== 密码锁 ===== */
/* ===== 主内容 ===== */
.main{
  max-width:720px;
  margin:0 auto;
  padding:0 16px 40px;
  display:none;
}
.main.show{display:block}

/* ===== 区块标题 ===== */
.section-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:24px 0 12px;
  padding-bottom:8px;
  border-bottom:1.5px solid var(--border);
}
.section-header h2{font-size:16px;font-weight:700}
.section-header .more{font-size:11px;color:var(--muted)}

/* ===== 场景入口（三层结构） ===== */
.scene-grid{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:16px;
}
.scene-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:.2s;
}
.scene-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.scene-card-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  color:var(--text);
  position:relative;
}
.scene-card-header:hover{background:#f8f4ef}
.scene-card-header .icon{width:38px;height:38px;flex-shrink:0}
.scene-card-header .info{flex:1}
.scene-card-header .info .name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.scene-card-header .info .desc{font-size:11px;color:var(--muted);margin-top:1px}
.scene-card-header .price-tag{
  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:4px;
  white-space:nowrap;
}
.price-green{background:#f0f6ec;color:#7B9A45}
.price-orange{background:#fef6f2;color:#E8652D}
.price-red{background:#fef2f2;color:#C0392B}
.scene-card-header .arrow{
  font-size:16px;color:var(--light);transition:.2s;margin-left:4px;
}
.scene-card.open .scene-card-header .arrow{transform:rotate(90deg)}
.scene-card-body{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid var(--border);
}
.scene-card.open .scene-card-body{display:block}
.scene-body-section{margin-top:14px}
.scene-body-section h4{
  font-size:12px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.scene-body-section h4 .badge{
  font-size:9px;
  font-weight:600;
  padding:1px 6px;
  border-radius:3px;
}
.scene-feature-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.scene-feature-item{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  padding:6px 10px;
  background:var(--bg);
  border-radius:6px;
  text-decoration:none;
  color:var(--text);
  transition:.2s;
}
.scene-feature-item:hover{background:var(--tag-bg)}
.scene-feature-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-green{background:#7B9A45}
.dot-orange{background:#E8652D}
.dot-accent{background:#C0392B}
.scene-feature-item .tag-sm{
  font-size:9px;
  padding:1px 5px;
  border-radius:2px;
  font-weight:600;
  margin-left:auto;
  flex-shrink:0;
}

/* ===== 摆摊品类网格 ===== */
.stall-cats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.stall-cat-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  background:var(--bg);
  border-radius:8px;
  text-decoration:none;
  color:var(--text);
  font-size:11px;
  transition:.2s;
}
.stall-cat-item:hover{background:var(--tag-bg)}
.stall-cat-item .cat-icon{font-size:14px}
.stall-cat-item .cat-name{flex:1}
.stall-cat-item .cat-count{
  font-size:9px;
  color:var(--light);
  font-weight:600;
}
.scene-body-cta{
  display:block;
  text-align:center;
  margin-top:12px;
  padding:8px 14px;
  background:var(--green);
  color:#fff;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}
.scene-body-cta:hover{background:#06AD56}
@media(max-width:480px){
  .scene-card-header{padding:14px}
  .scene-card-header .info .name{font-size:14px}
  .scene-card-body{padding:0 14px 14px}
}

/* ===== 产品卡列表 ===== */
.card-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.card-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:var(--card);
  border-radius:10px;
  text-decoration:none;
  color:var(--text);
  box-shadow:var(--shadow);
  transition:.2s;
}
.card-item:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.card-item .emoji{font-size:22px;width:30px;text-align:center}
.card-item .info{flex:1;min-width:0}
.card-item .name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.card-item .desc{font-size:11px;color:var(--muted);margin-top:1px}
.tag{
  font-size:9px;
  padding:2px 7px;
  border-radius:3px;
  font-weight:600;
  white-space:nowrap;
}
.tag-free{background:#f0f6ec;color:#7B9A45}
.tag-paid{background:#fef6f2;color:var(--accent-light)}
.card-item .arrow{color:#ddd;font-size:14px}

/* ===== 钩子区 ===== */
.hook-box{
  background:linear-gradient(135deg,#fff 0%,#fef9f5 100%);
  border-radius:16px;
  padding:24px 20px;
  margin:20px 0;
  border:1px solid #f5ede5;
}
.hook-box h3{font-size:15px;font-weight:700;margin-bottom:12px}
.hook-item{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  align-items:flex-start;
}
.hook-item:last-child{margin-bottom:0}
.hook-num{
  width:22px;
  height:22px;
  background:var(--accent);
  color:#fff;
  border-radius:50%;
  font-size:11px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  margin-top:2px;
}
.hook-text{font-size:12.5px;line-height:1.6;color:#555}
.hook-text strong{color:var(--text)}

/* ===== 场景专区切换 ===== */
.zone-tabs{
  display:flex;
  gap:6px;
  margin-bottom:10px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.zone-tab{
  padding:7px 14px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  background:var(--tag-bg);
  color:var(--muted);
  cursor:pointer;
  border:none;
  transition:.2s;
  white-space:nowrap;
}
.zone-tab.active{background:var(--accent);color:#fff}
.zone-tab:hover:not(.active){background:#e4ddd4}
.zone-content{display:none;width:100%;max-width:100%}
.zone-content.active{display:block}

/* ===== 付费产品卡·移动端热榜 ===== */
.zone-hot-wrap{
  background:var(--card);
  border-radius:16px;
  padding:16px 0;
  margin:14px 0;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.zone-hot-tabs{
  display:flex;
  gap:4px;
  padding:0 14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  margin-bottom:8px;
}
.zone-hot-tabs::-webkit-scrollbar{display:none}
.zone-hot-tab{
  flex-shrink:0;
  padding:6px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
  background:var(--tag-bg);
  color:var(--muted);
  border:none;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.zone-hot-tab.active{
  background:var(--accent);
  color:#fff;
  box-shadow:0 2px 8px rgba(192,57,43,.25);
}
.zone-sep{
  flex-shrink:0;
  padding:6px 8px;
  font-size:10px;
  color:var(--light);
  letter-spacing:2px;
  white-space:nowrap;
  display:flex;
  align-items:center;
}
.zone-hot-cards{
  padding:0 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.zone-hot-card{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:var(--bg);
  border-radius:10px;
  text-decoration:none;
  color:var(--text);
  transition:.2s;
  position:relative;
}
.zone-hot-card:active{background:var(--tag-bg);transform:scale(.98)}
.zone-hot-card .rank{
  font-size:11px;
  font-weight:800;
  width:20px;
  text-align:center;
  flex-shrink:0;
  color:#bbb;
}
.zone-hot-card .rank.top1{color:#FF6B35}
.zone-hot-card .rank.top2{color:#E8652D}
.zone-hot-card .rank.top3{color:#C0392B}
.zone-hot-card .h-emoji{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.zone-hot-card .h-info{flex:1;min-width:0}
.zone-hot-card .h-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.zone-hot-card .h-name .h-tag{
  font-size:8px;
  padding:1px 5px;
  border-radius:3px;
  font-weight:600;
}
.zone-hot-card .h-name .h-hot{background:#fef2f2;color:#C0392B}
.zone-hot-card .h-name .h-new{background:#f0f6ec;color:#7B9A45}
.zone-hot-card .h-name .h-fire{background:#fef6f2;color:#E8652D}
.zone-hot-card .h-desc{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.4}
.zone-hot-card .h-arrow{color:#ccc;font-size:12px;flex-shrink:0}
.zone-hot-sub{
  font-size:10px;
  color:var(--muted);
  padding:2px 14px 10px;
  line-height:1.5;
}
.wechat-box{
  background:var(--card);
  border-radius:16px;
  padding:28px 20px;
  text-align:center;
  box-shadow:var(--shadow);
  margin:20px 0;
}
.wechat-box h3{font-size:16px;font-weight:700;margin-bottom:4px}
.wechat-box .sub{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.wechat-box .qrcode{
  width:80px;
  height:80px;
  margin:0 auto 8px;
  border-radius:8px;
  border:2px dashed var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#ccc;
  background:#faf8f6;
}
.wechat-box .qrcode img{width:100%;height:100%;border-radius:10px;object-fit:cover}
.wechat-box .wxid{font-size:13px;color:#666;margin-bottom:4px}
.wechat-box .wxid strong{color:var(--green)}
.wechat-box .tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  margin:12px 0;
}
.wechat-box .tags span{
  font-size:11px;
  padding:4px 12px;
  background:var(--tag-bg);
  border-radius:20px;
  color:#666;
}
.wechat-box .hint{font-size:10px;color:#ccc;margin-top:8px}

/* ===== 会员体系 ===== */
.price-box{
  background:var(--card);
  border-radius:16px;
  padding:24px 20px;
  box-shadow:var(--shadow);
  margin:20px 0;
}
.price-box h3{font-size:15px;font-weight:700;margin-bottom:14px;text-align:center}
.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #f2eee8;
  font-size:13px;
}
.price-row:last-child{border-bottom:none}
.price-row .label{color:#555}
.price-row .label .tag-tier{
  display:inline-block;
  font-size:9px;
  padding:1px 6px;
  border-radius:3px;
  margin-left:6px;
  font-weight:600;
}
.tag-tier.green{background:#f0f6ec;color:#7B9A45}
.tag-tier.orange{background:#fef6f2;color:var(--accent-light)}
.price-row .price{font-weight:700;color:var(--accent-light)}
.price-row .price.free{color:var(--green)}
.price-note{
  font-size:10px;
  color:#bbb;
  text-align:center;
  margin-top:12px;
}

/* ===== 知识体系展示 ===== */
.knowledge-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin:6px 0;
}
.know-item{
  background:var(--card);
  border-radius:var(--radius);
  padding:6px 10px;
  box-shadow:var(--shadow);
  text-align:center;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.know-item .icon{font-size:15px}
.know-item .title{font-size:12px;font-weight:600;white-space:nowrap}
.know-item .desc{display:none}

/* 流行趋势动效 */
@keyframes firePulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

/* 折叠查看更多 */
.cat-fold{position:relative;margin-bottom:4px}
.cat-grid{overflow:visible;max-height:none}
.cat-more{display:none}

/* ===== 科普卡片 ===== */
.know-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:.2s;
  border:1px solid transparent;
}
.know-card:hover{border-color:var(--border);transform:translateY(-1px)}
.know-card .k-icon{font-size:26px;margin-bottom:6px}
.know-card .k-title{font-size:14px;font-weight:600;margin-bottom:3px}
.know-card .k-summary{font-size:12px;color:var(--muted);line-height:1.6}

/* ===== 知识库tab ===== */
.knowledge-tabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.know-tab{
  padding:7px 14px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  background:var(--tag-bg);
  color:var(--muted);
  cursor:pointer;
  border:none;
  transition:.2s;
  white-space:nowrap;
}
.know-tab.active{background:var(--accent);color:#fff}
.know-tab:hover:not(.active){background:var(--border)}

/* ===== 分享按钮 ===== */
.share-row{
  display:flex;
  gap:6px;
  margin-top:6px;
  justify-content:flex-end;
}
.share-btn{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:10px;
  padding:3px 8px;
  border-radius:4px;
  background:var(--tag-bg);
  color:var(--muted);
  border:none;
  cursor:pointer;
  transition:.2s;
}
.share-btn:hover{background:var(--border);color:var(--text)}

/* ===== AI入口 ===== */
.ai-entrance{
  background:linear-gradient(135deg,#faf6f0 0%,#fef9f5 100%);
  border-radius:16px;
  padding:24px 20px;
  text-align:center;
  margin:24px 0;
  border:1px solid #f5ede5;
}
.ai-entrance h3{font-size:15px;font-weight:700;margin-bottom:4px}
.ai-entrance p{font-size:12px;color:var(--muted);margin-bottom:12px}
.ai-row{display:flex;gap:8px;max-width:400px;margin:0 auto}
.ai-row input{
  flex:1;
  padding:9px 14px;
  border:1.5px solid var(--border);
  border-radius:8px;
  font-size:13px;
  outline:none;
  background:var(--card);
}
.ai-row input:focus{border-color:var(--accent)}
.ai-row button{
  padding:9px 18px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.ai-row button:hover{background:#9a2b20}
.ai-answer{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);

function renderAllCards() {
  const container = document.getElementById('hotContent');
  if (!container) return;
  // 不清空，追加在后面
  // container.innerHTML = '';
  
  const hotTags = ['🔥', '📈', '💥', '⭐', '💎', '🚀'];
  let tagIdx = 0;
  
  ZONES.forEach((zone) => {
    const cards = zone.cards;
    if (!cards || cards.length === 0) return;
    if (zone.is_sep) return;
    const tagType = hotTags[tagIdx % hotTags.length];
    tagIdx++;
    
    let html = '<div class="zone-hot-sub">' + zone.name + ' <span class="h-tag h-hot">' + tagType + '</span></div>';
    html += '<div class="zone-hot-cards">';
    
    cards.forEach((c, i) => {
      const rankClass = i===0 ? 'top1' : i===1 ? 'top2' : i===2 ? 'top3' : '';
      html += '<a class="zone-hot-card" href="' + c.f + '" title="' + c.n + '">' +
        '<div class="rank ' + rankClass + '">' + (i+1) + '</div>' +
        '<div class="h-emoji">' + c.e + '</div>' +
        '<div class="h-info">' +
          '<div class="h-name">' + c.n + ' <span class="h-tag h-hot">' + tagType + '</span></div>' +
          '<div class="h-desc">' + c.d + '</div>' +
        '</div>' +
        '<div class="h-arrow">›</div>' +
      '</a>';
    });
    
    html += '</div>';
    container.innerHTML += html;
  });
}
