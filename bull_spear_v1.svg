<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="520" height="680">
  <!-- 牛头+矛+握杆 — 简洁logo风，参考会所logo的感觉 -->
  <!-- 整体单一色调，看过去干净有辨识度 -->
  
  <!-- 牛头正面剪影（深色） -->
  <g fill="#3D2218" stroke="none">
    <!-- 牛脸 -->
    <path d="M 130 155 
             Q 100 155, 80 175 
             Q 72 195, 75 235 
             Q 78 270, 130 280 
             Q 182 270, 185 235 
             Q 188 195, 180 175 
             Q 160 155, 130 155 Z"/>
    
    <!-- 左耳 -->
    <ellipse cx="72" cy="178" rx="15" ry="22" transform="rotate(-20 72 178)"/>
    
    <!-- 右耳 -->
    <ellipse cx="188" cy="178" rx="15" ry="22" transform="rotate(20 188 178)"/>
    
    <!-- 左角（竖直微内弯，粗壮） -->
    <path d="M 108 168 
             C 100 140, 88 100, 84 65 
             C 82 48, 84 35, 88 28
             C 92 30, 95 48, 98 70
             C 102 100, 110 135, 114 162"/>
    
    <!-- 右角 -->
    <path d="M 152 168 
             C 160 140, 172 100, 176 65 
             C 178 48, 176 35, 172 28
             C 168 30, 165 48, 162 70
             C 158 100, 150 135, 146 162"/>
    
    <!-- 眼睛（大而精神） -->
    <ellipse cx="105" cy="200" rx="16" ry="18" fill="white"/>
    <ellipse cx="108" cy="202" rx="10" ry="11" fill="#1A0E08"/>
    <ellipse cx="102" cy="195" rx="3" ry="3" fill="white"/>
    
    <ellipse cx="155" cy="200" rx="16" ry="18" fill="white"/>
    <ellipse cx="152" cy="202" rx="10" ry="11" fill="#1A0E08"/>
    <ellipse cx="148" cy="195" rx="3" ry="3" fill="white"/>
    
    <!-- 鼻子 -->
    <ellipse cx="120" cy="240" rx="7" ry="4" fill="#1A0E08"/>
    <ellipse cx="140" cy="240" rx="7" ry="4" fill="#1A0E08"/>
  </g>
  
  <!-- 矛：穿过牛头下方，斜向 -->
  <line x1="115" y1="275" x2="160" y2="340" stroke="#3D2218" stroke-width="5" stroke-linecap="round"/>
  
  <!-- 矛头（菱形） -->
  <polygon points="115,275 75,245 95,225 135,255" fill="#3D2218"/>
  <!-- 矛头中线 -->
  <line x1="95" y1="225" x2="115" y2="275" stroke="#5A3A28" stroke-width="2"/>
  
  <!-- 握杆末端 -->
  <line x1="145" y1="315" x2="148" y2="308" stroke="#3D2218" stroke-width="6" stroke-linecap="round"/>
</svg>
