<script>
// ===== 品类Profile =====
var P = {
  '卤味':{m:4,s:4,r:3,mg:0.62,cs:[{n:'卤鸭脖创业母卡',t:'母卡',p:'¥69',l:'catalog/LW/LW001 卤鸭脖（母）LW_001.html',r:'卤味基础模型，标准化高'},{n:'卤鸭翅（母）',t:'母卡',p:'¥69',l:'catalog/LW/LW002 卤鸭翅（母）LW_002.html',r:'出品率高，新手友好'}]},
  '冷吃红油':{m:5,s:4,r:2,mg:0.68,cs:[{n:'冷吃红油创业母卡',t:'母卡',p:'¥69',l:'catalog/其他/LC_001 冷吃红油创业母卡.html',r:'毛利高，预算够可入'},{n:'冷吃牛肉条（子）',t:'子卡',p:'¥39',l:'catalog/其他/LC_002 冷吃牛肉条（子）.html',r:'头牌产品先做它'}]},
  '韩式炸鸡':{m:4,s:5,r:3,mg:0.58,cs:[{n:'原味黄金炸鸡（母）',t:'母卡',p:'¥69',l:'catalog/其他/HZ_001 原味黄金炸鸡（母）.html',r:'标准化极强，零基础可做'},{n:'蜜汁酱裹鸡块（母）',t:'母卡',p:'¥69',l:'catalog/其他/HZ_002 蜜汁酱裹鸡块（母）.html',r:'复购率最高'}]},
  '炒鸡':{m:3,s:3,r:4,mg:0.55,cs:[{n:'炒鸡创业母卡',t:'母卡',p:'¥69',l:'catalog/CJ/CJ_M01_炒鸡创业母卡.html',r:'毛利稳，需后厨经验'},{n:'炒鸡工艺体系',t:'子卡',p:'¥39',l:'catalog/CJ/CJ_V01_炒鸡工艺体系.html',r:'先看工艺再决定'}]},
  '酸汤':{m:3,s:3,r:3,mg:0.56,cs:[{n:'贵州酸汤创业母卡',t:'母卡',p:'¥69',l:'catalog/其他/ST_M01 贵州酸汤创业母卡.html',r:'酸汤热赛道，入局好时机'},{n:'酸汤鱼（子）',t:'子卡',p:'¥39',l:'catalog/其他/ST_01 酸汤鱼（子）.html',r:'头牌产品先验证市场'}]},
  '早餐面点':{m:4,s:3,r:2,mg:0.65,cs:[{n:'鲜肉包（母）',t:'母卡',p:'¥69',l:'catalog/其他/MP_001 鲜肉包（母）.html',r:'早餐刚需回本快'},{n:'煎饼果子（母）',t:'母卡',p:'¥69',l:'catalog/其他/MP_008 煎饼果子（母）.html',r:'单品利润高'}]},
  '饮品甜品':{m:5,s:5,r:3,mg:0.72,cs:[{n:'五指毛桃椰乳（母）',t:'母卡',p:'¥69',l:'catalog/其他/TS_065 五指毛桃椰乳（母）.html',r:'毛利极高标准化最强'},{n:'斑斓冻（母）',t:'母卡',p:'¥69',l:'catalog/其他/TS_003 斑斓冻（母）.html',r:'网红+高毛利'}]},
  '小吃烤串':{m:4,s:3,r:3,mg:0.60,cs:[{n:'臭豆腐（母）',t:'母卡',p:'¥69',l:'catalog/其他/XC_100 臭豆腐（母）.html',r:'刚需小吃无淡季'},{n:'铁板鱿鱼（母）',t:'母卡',p:'¥69',l:'catalog/其他/XC_101 铁板鱿鱼（母）.html',r:'夜市爆品出餐快'}]},
  '傣舂舂菜':{m:5,s:2,r:2,mg:0.70,cs:[{n:'傣舂鸡脚（母）',t:'母卡',p:'¥69',l:'catalog/其他/DC_001 傣舂鸡脚（母）.html',r:'视觉强适合短视频'},{n:'傣舂大虾（母）',t:'母卡',p:'¥69',l:'catalog/其他/DC_003 傣舂大虾（母）.html',r:'客单价高利润大'}]}
};

function gv(i){return document.getElementById(i).value}

function run(){
  var cat=gv('f_cat');if(!cat){st('请选择品类');return}
  var p=P[cat];if(!p){st('品类数据异常');return}

  var city=parseInt(gv('f_city'));
  var loc=parseInt(gv('f_loc'));
  var fmt=parseInt(gv('f_fmt'));
  var area=parseInt(gv('f_area'));
  var budget=parseInt(gv('f_budget'));
  var rent=parseInt(gv('f_rent'));
  var price=parseInt(gv('f_price'));
  var delv=parseInt(gv('f_delivery'));
  var burn=parseInt(gv('f_burn'));
  var exp=parseInt(gv('f_exp'));
  var tech=parseInt(gv('f_tech'));
  var staff=parseInt(gv('f_staff'));
  var hours=parseInt(gv('f_hours'));
  var comp=parseInt(gv('f_comp'));
  var edge=parseInt(gv('f_edge'));
  var supply=parseInt(gv('f_supply'));
  var target=parseInt(gv('f_target'));

  // ===== 系数 =====
  var cm=[1.1,1.0,0.85][city];
  var locScore=[4,4,4,3,4,3,3][loc]; // 位置类型 1-5分
  var fmtScore=[0.9,1.0,0.7][fmt];
  var areaScore=[0.7,1.0,1.1,1.2][area];
  var bm=[0.5,0.7,1.0,1.2,1.4][budget];
  var rentScore=Math.max(0.3,1-rent/(budget+1)*0.35);
  var priceScore=[0.7,0.9,1.0,1.0,0.8][price]; // 高低两端扣分
  var delvScore=[1.1,1.0,0.8][delv];
  var burnScore=[0.5,0.8,1.0,1.2][burn];
  var em=[0.6,1.0,1.2][exp];
  var tm=[0.5,0.9,1.1,1.2][tech];
  var sm=[0.7,0.9,1.1,1.2][staff];
  var hoursScore=[0.7,1.0,1.2][hours];
  var compScore=[1.0,0.8,0.5,0.3][comp];
  var edgeScore=[0.6,1.0,1.1,1.2][edge];
  var supScore=[0.7,1.0,1.2][supply];
  var targetCap=Math.round(600*cm); // 品类日均营收基础
  var targetScore=target<=2?1.0:target==3?0.8:0.5;

  // ===== 6维评分（各100分制，最后加权）=====

  // ① 选址开店 30%
  // 客流捕获 × 城市 × 位置类型 × 交通 × 形式
  var locBase=(locScore/5)*70+10; // 基础30-80
  var siteScore=Math.round(Math.min(100,locBase*cm*(fmtScore+1)/2));

  // ② 产品成本结构 25%
  // 预算×租金×客单价×外卖占比
  var costScore=Math.round(Math.min(100,(bm*rentScore*priceScore*delvScore)*70+10));

  // ③ 竞争穿透 12%
  // 竞争密度反向×独特卖点×供应链
  var compBase=(compScore*0.5+edgeScore*0.3+supScore*0.2)*70+10;
  var compScoreD=Math.round(Math.min(100,compBase));

  // ④ 客群吻合 12%
  // 城市×位置×客单价匹配度
  var crowdScore=Math.round(Math.min(100,(cm*locScore/5*priceScore)*70+10));

  // ⑤ 大盘品类赛道 10%
  // 品类热度×城市×经营形式
  var catScore=Math.round(Math.min(100,(p.m/5)*cm*fmtScore*70+10));

  // ⑥ 门店形式 8%
  // 形式×面积×时段×人员
  var fmtScoreD=Math.round(Math.min(100,(fmtScore*areaScore*hoursScore*sm)*60+10));

  // 独立风险扣分
  var riskDeduction=0;
  var riskList=[];
  if(exp==0&&p.r>=3){riskDeduction+=10;riskList.push({l:'高',t:'零经验+高风险品类，三个月内关店概率>40%'})}
  if(comp==3){riskDeduction+=10;riskList.push({l:'高',t:'竞争饱和区，利润空间被严重压缩'})}
  if(rent>=3&&budget<=1){riskDeduction+=8;riskList.push({l:'高',t:'租金占总预算比>30%，现金流压力极大'})}
  if(tech==0&&p.s<=3){riskDeduction+=6;riskList.push({l:'中',t:'自学技术+低标准化=出品不稳定'})}
  if(burn==0&&budget<=1){riskDeduction+=6;riskList.push({l:'中',t:'无亏损承受力+预算低=抗风险极弱'})}
  if(target>=3&&targetCap<target*2){riskDeduction+=5;riskList.push({l:'中',t:'期望日营收高于品类均值50%+，不现实'})}
  if(supply==0){riskDeduction+=3;riskList.push({l:'低',t:'没有稳定供应链，原料波动风险'})}
  if(fmt==2&&delv==2){riskDeduction+=5;riskList.push({l:'中',t:'纯外卖+高抽佣=盈利空间被两头挤压'})}
  if(riskList.length==0){riskList.push({l:'低',t:'未发现显著风险点'})}

  // ===== 加权总分 =====
  var rawScore=siteScore*0.30+costScore*0.25+compScoreD*0.12+crowdScore*0.12+catScore*0.10+fmtScoreD*0.08;
  var finalScore=Math.round(Math.max(0,Math.min(100,rawScore-riskDeduction)));
  var grade=finalScore>=75?'A':finalScore>=60?'B':finalScore>=40?'C':'D';
  var color={A:'#00ff88',B:'#4db8ff',C:'#ffcc00',D:'#ff4d4d'}[grade];
  var bg={A:'rgba(0,255,136,.1)',B:'rgba(77,184,255,.1)',C:'rgba(255,204,0,.1)',D:'rgba(255,77,77,.1)'}[grade];
  var verdict=finalScore>=75?'✅ 可行，建议推进':finalScore>=60?'⚠️ 有条件可行，需优化短板':finalScore>=40?'❌ 风险较高，不建议当前条件进入':'❌ 否决，条件远不成熟';
  var timing=finalScore>=75?'当前条件适合进入':finalScore>=60?'建议调整薄弱项后进入':'建议暂缓，改善核心条件';

  // ===== 维度展示排序 =====
  var dims=[
    {n:'选址开店',s:siteScore,c:'#00ff88'},
    {n:'成本结构',s:costScore,c:'#4db8ff'},
    {n:'竞争穿透',s:compScoreD,c:'#ffcc00'},
    {n:'客群吻合',s:crowdScore,c:'#ff8800'},
    {n:'品类赛道',s:catScore,c:'#ff66aa'},
    {n:'门店形式',s:fmtScoreD,c:'#aa66ff'}
  ];
  dims.sort(function(a,b){return a.s-b.s});

  // ===== 行动建议 =====
  var acts=[];
  if(dims[0].s<50) acts.push('【短板1：'+dims[0].n+'】得分仅'+dims[0].s+'分，这是最大瓶颈，优先改善');
  if(dims[1].s<50) acts.push('【短板2：'+dims[1].n+'】得分'+dims[1].s+'分，需重点优化');
  if(exp==0) acts.push('零经验建议先从体验卡（¥0）试做，验证品类可行性再投入');
  if(comp>=2) acts.push('竞争激烈，建议走差异化路线：选一个细分口味或场景切入');
  if(budget<=1) acts.push('预算有限，优先摆摊或档口形式跑通模型，不要一次性开店');
  if(burn==0) acts.push('预留3个月生活费，避免因短期亏损被迫关店');
  if(rent>=3) acts.push('租金过高，建议控制在月流水的15%以内');
  if(supply==0) acts.push('尽快建立稳定供应链，批量采购降低成本');
  if(tech<=1) acts.push('建议购买标准化产品卡（母卡¥69），直接获取成熟配方和工艺');
  acts.push('从下方推荐的产品卡中选择1-2张核心卡先跑通');
  acts.push('加沧林微信 canglin1985，获取一对一诊断建议');

  // ===== 渲染 =====
  document.getElementById('inputPage').classList.remove('active');
  document.getElementById('resultPage').classList.add('active');

  var h='';

  // 结论
  h+='<div class="section" style="animation-delay:0s"><div class="sh">综合可行性评分</div><div class="sc-h">';
  h+='<div class="rg" style="background:'+color+'"><div class="nm">'+finalScore+'</div></div>';
  h+='<div class="gd" style="background:'+bg+';color:'+color+'">'+grade+' 级</div>';
  h+='<div class="vd" style="color:'+color+'">'+verdict+'</div>';
  h+='<div class="timing" style="font-size:10px;color:#6b7a8a">'+timing+'</div>';
  h+='<div class="br"><span style="background:'+bg+';color:'+color+'">选址 '+(grade=='A'||grade=='B'?'✓':'△')+'</span><span style="background:'+bg+';color:'+color+'">成本 '+(costScore>=60?'✓':'△')+'</span><span style="background:'+bg+';color:'+color+'">竞争 '+(compScoreD>=60?'✓':'△')+'</span></div>';
  h+='</div></div>';

  // 6维雷达
  h+='<div class="section"><div class="sh">六维能力评估</div>';
  h+='<div class="dw"><span class="dl">选址开店</span><div class="dt"><div class="df" style="width:'+siteScore+'%;background:#00ff88"></div></div><span class="ds">'+siteScore+'</span></div>';
  h+='<div class="dw"><span class="dl">成本结构</span><div class="dt"><div class="df" style="width:'+costScore+'%;background:#4db8ff"></div></div><span class="ds">'+costScore+'</span></div>';
  h+='<div class="dw"><span class="dl">竞争穿透</span><div class="dt"><div class="df" style="width:'+compScoreD+'%;background:#ffcc00"></div></div><span class="ds">'+compScoreD+'</span></div>';
  h+='<div class="dw"><span class="dl">客群吻合</span><div class="dt"><div class="df" style="width:'+crowdScore+'%;background:#ff8800"></div></div><span class="ds">'+crowdScore+'</span></div>';
  h+='<div class="dw"><span class="dl">品类赛道</span><div class="dt"><div class="df" style="width:'+catScore+'%;background:#ff66aa"></div></div><span class="ds">'+catScore+'</span></div>';
  h+='<div class="dw"><span class="dl">门店形式</span><div class="dt"><div class="df" style="width:'+fmtScoreD+'%;background:#aa66ff"></div></div><span class="ds">'+fmtScoreD+'</span></div>';
  h+='<div style="margin-top:6px;font-size:10px;color:#6b7a8a;text-align:center">风险扣分：-'+riskDeduction+'分</div>';
  h+='</div>';

  // 风险
  h+='<div class="section"><div class="sh">⚠️ 风险清单</div><ul class="rl">';
  riskList.forEach(function(r){
    var c=r.l=='高'?'#ff4d4d':r.l=='中'?'#ffcc00':'#6b7a8a';
    h+='<li><span class="d" style="background:'+c+'"></span><span>【'+r.l+'】'+r.t+'</span></li>';
  });
  h+='</ul></div>';

  // 商业模型
  var dailyP=Math.round(600*cm*(p.mg));
  h+='<div class="section"><div class="sh">💰 商业模型参考</div><div class="bg">';
  h+='<div class="bi"><div class="v">'+(p.mg*100|0)+'%</div><div class="l">品类毛利率</div></div>';
  h+='<div class="bi"><div class="v">¥'+dailyP+'</div><div class="l">日利润参考</div></div>';
  h+='<div class="bi"><div class="v">'+(budget<=1?'3-4月':budget==2?'4-6月':'6-12月')+'</div><div class="l">预估回本周期</div></div>';
  h+='<div class="bi"><div class="v">'+(target<=2?'合理':target==3?'偏高':'过高')+'</div><div class="l">日营收预期判断</div></div>';
  h+='</div></div>';

  // 短板
  h+='<div class="section"><div class="sh">🔍 薄弱环节（得分最低3项）</div>';
  for(var i=0;i<3&&i<dims.length;i++){
    var d=dims[i];
    var adv=d.s<40?'严重短板，需优先处理':d.s<60?'需优化':'状态良好';
    h+='<div style="padding:6px 0;border-bottom:1px solid #1e2a38;font-size:11px;display:flex;justify-content:space-between">';
    h+='<span style="color:#c0d0e0">'+(i+1)+'. '+d.n+'</span>';
    h+='<span style="color:'+(d.s<40?'#ff4d4d':d.s<60?'#ffcc00':'#00ff88')+'">'+d.s+'分 · '+adv+'</span>';
    h+='</div>';
  }
  h+='</div>';

  // 产品推荐
  h+='<div class="section"><div class="sh">📦 推荐产品卡</div>';
  p.cs.forEach(function(c){
    h+='<a class="pd" href="'+c.l+'">';
    h+='<div class="t"><span class="n">'+c.n+'</span><span class="tg" style="background:'+(c.t==='母卡'?'rgba(0,255,136,.15)':'rgba(77,184,255,.15)')+';color:'+(c.t==='母卡'?'#00ff88':'#4db8ff')+'">'+c.t+'</span></div>';
    h+='<div class="m">匹配：'+c.r+'</div><div class="lk">'+c.p+' → 查看</div></a>';
  });
  h+='</div>';

  // 行动
  h+='<div class="section"><div class="sh">📋 行动建议</div><ol class="al">';
  acts.forEach(function(a){h+='<li>'+a+'</li>'});
  h+='</ol></div>';

  document.getElementById('rp').innerHTML=h;
  window.scrollTo({top:0});
}

function st(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2000)}
function sw(){st('微信号 canglin1985（已复制）');var i=document.createElement('input');i.value='canglin1985';document.body.appendChild(i);i.select();document.execCommand('copy');document.body.removeChild(i)}
function rs(){
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('inputPage').classList.add('active');
  document.getElementById('rp').innerHTML='';window.scrollTo({top:0})
}
</script>
