<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480">
  <!-- 方案A：黄牛角 — 突出竖直向上，尖端微内弯 -->
  <defs>
    <linearGradient id="hornGradA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="50%" stop-color="#A0896A"/>
      <stop offset="100%" stop-color="#C4AD8D"/>
    </linearGradient>
    <linearGradient id="faceGradA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#7A5C4A"/>
    </linearGradient>
  </defs>
  
  <!-- 牛角：从头顶两侧伸出，先微向外，再竖直向上，尖端微内弯 -->
  <!-- 左角 -->
  <path d="M 72 128 
           C 68 110, 60 90, 56 74 
           C 52 58, 54 42, 60 35
           C 64 40, 63 52, 62 64
           C 60 78, 64 96, 70 114
           C 73 122, 74 128, 74 128" 
        fill="url(#hornGradA)" stroke="#6B5B3E" stroke-width="1"/>
  
  <!-- 右角 -->
  <path d="M 128 128 
           C 132 110, 140 90, 144 74 
           C 148 58, 146 42, 140 35
           C 136 40, 137 52, 138 64
           C 140 78, 136 96, 130 114
           C 127 122, 126 128, 126 128" 
        fill="url(#hornGradA)" stroke="#6B5B3E" stroke-width="1"/>
  
  <!-- 牛脸 -->
  <path d="M 72 128 L 72 200 Q 100 215 128 200 L 128 128 Q 100 118 72 128" 
        fill="url(#faceGradA)" stroke="#4A3228" stroke-width="1.5"/>
  
  <!-- 眼睛 -->
  <ellipse cx="88" cy="152" rx="7" ry="8" fill="#2C1A10"/>
  <ellipse cx="112" cy="152" rx="7" ry="8" fill="#2C1A10"/>
  <ellipse cx="89" cy="150" rx="2.5" ry="2.5" fill="white" opacity="0.6"/>
  <ellipse cx="113" cy="150" rx="2.5" ry="2.5" fill="white" opacity="0.6"/>
  
  <!-- 鼻子 -->
  <path d="M 91 182 Q 100 192 109 182" fill="none" stroke="#3D281E" stroke-width="2"/>
  <ellipse cx="95" cy="185" rx="3" ry="3" fill="#3D281E"/>
  <ellipse cx="105" cy="185" rx="3" ry="3" fill="#3D281E"/>
  
  <!-- 牛角尖端尖刺细节 -->
  <path d="M 60 35 L 57 28" stroke="#C4AD8D" stroke-width="2" stroke-linecap="round"/>
  <path d="M 140 35 L 143 28" stroke="#C4AD8D" stroke-width="2" stroke-linecap="round"/>
</svg>