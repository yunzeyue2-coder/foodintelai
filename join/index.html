<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodIntelAI · 加入我们</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;padding:16px}
.card{background:#fff;border-radius:14px;padding:28px 20px;width:460px;max-width:100%;box-shadow:0 2px 16px rgba(0,0,0,.04);border:1px solid #e0d5c8;text-align:center}
.brand{font-size:10px;color:#c8a86e;letter-spacing:3px;margin-bottom:6px}
h1{font-size:17px;color:#2a2218;font-weight:700;margin-bottom:4px}
.row{display:flex;gap:14px;justify-content:center;margin-top:14px}
.item{flex:1;max-width:130px;text-align:center}
.tag{font-size:11px;color:#2a2218;font-weight:600;margin-bottom:1px}
.desc{font-size:9px;color:#8a7a6a;margin-bottom:6px}
.qr{width:110px;height:110px;margin:0 auto;border-radius:6px;overflow:hidden;border:1px solid #e0d5c8}
.qr img{width:100%;height:100%;object-fit:contain}
.link{display:block;font-size:9px;color:#c8a86e;margin-top:3px;text-decoration:none}
.divider{width:1px;background:#e0d5c8;margin:0 2px}
.footer{margin-top:16px;padding-top:10px;border-top:1px solid #f0e8dc;font-size:9px;color:#aaa;letter-spacing:1px}
.region-tag{font-size:8px;color:#c8a86e;letter-spacing:1px;margin-bottom:6px}
@media(max-width:400px){.item{max-width:100px}.qr{width:90px;height:90px}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">FOODINTELAI</div>
  <h1>加入我们</h1>

  <div class="row">
    <div class="item">
      <div class="region-tag">🌐 国际</div>
      <div class="tag">📡 频道</div>
      <div class="desc">海外趋势 · 全球数据</div>
      <div class="qr"><img src="qr_channel_user.png" alt="频道"></div>
      <a class="link" href="https://t.me/canglinguanju">@canglinguanju</a>
    </div>

    <div class="divider"></div>

    <div class="item">
      <div class="region-tag">🇨🇳 国内</div>
      <div class="tag">📖 公众号</div>
      <div class="desc">食品决策库</div>
      <div class="qr"><img src="../gongzhonghao_qr.jpg" alt="公众号"></div>
    </div>

    <div class="divider"></div>

    <div class="item">
      <div class="region-tag">🇨🇳 国内</div>
      <div class="tag">🔗 微信</div>
      <div class="desc">canglin1985</div>
      <div class="qr" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#8a7a6a">微信号<br>canglin1985</div>
    </div>
  </div>

  <div class="footer">FoodIntelAI · 食品决策库 · 做食品创业前，先看数据</div>
</div>
</body>
</html>
