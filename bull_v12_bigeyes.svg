<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="520" height="640">
  <!-- 牛头+牛角：角竖直向上，尖端微内弯 -->
  <defs>
    <!-- 牛角色渐变 -->
    <linearGradient id="hornGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7A6548"/>
      <stop offset="40%" stop-color="#A08865"/>
      <stop offset="100%" stop-color="#C4A880"/>
    </linearGradient>
    <!-- 牛脸渐变 -->
    <linearGradient id="faceGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="100%" stop-color="#7A5540"/>
    </linearGradient>
    <!-- 眼睛光晕 -->
    <radialGradient id="eyeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 牛头脸轮廓 -->
  <path d="M 95 165 
           Q 80 175, 78 220 
           Q 78 260, 130 270 
           Q 182 260, 182 220 
           Q 180 175, 165 165 
           Q 130 155, 95 165" 
        fill="url(#faceGrad)" stroke="#3D2218" stroke-width="2"/>

  <!-- 左耳 -->
  <ellipse cx="80" cy="168" rx="18" ry="25" fill="#8B6B50" stroke="#3D2218" stroke-width="1.5" transform="rotate(-15 80 168)"/>
  <ellipse cx="82" cy="170" rx="10" ry="15" fill="#A08065" transform="rotate(-15 82 170)"/>
  
  <!-- 右耳 -->
  <ellipse cx="180" cy="168" rx="18" ry="25" fill="#8B6B50" stroke="#3D2218" stroke-width="1.5" transform="rotate(15 180 168)"/>
  <ellipse cx="178" cy="170" rx="10" ry="15" fill="#A08065" transform="rotate(15 178 170)"/>

  <!-- 左角：竖直向上，微向内弯 -->
  <path d="M 108 165 
           C 96 130, 85 95, 82 60 
           C 80 40, 82 28, 86 22
           C 90 28, 92 42, 96 65
           C 100 90, 108 125, 112 160" 
        fill="url(#hornGrad)" stroke="#5A4A30" stroke-width="2"/>

  <!-- 右角：竖直向上，微向内弯 -->
  <path d="M 152 165 
           C 164 130, 175 95, 178 60 
           C 180 40, 178 28, 174 22
           C 170 28, 168 42, 164 65
           C 160 90, 152 125, 148 160" 
        fill="url(#hornGrad)" stroke="#5A4A30" stroke-width="2"/>

  <!-- ★ 大而特别的双眼 ★ -->
  <!-- 左眼框 -->
  <ellipse cx="108" cy="195" rx="22" ry="24" fill="#1A0E08"/>
  <ellipse cx="108" cy="195" rx="19" ry="21" fill="#2A180E"/>
  <!-- 瞳孔（大） -->
  <ellipse cx="108" cy="195" rx="12" ry="14" fill="#0A0502"/>
  <!-- 高光 -->
  <ellipse cx="102" cy="188" rx="5" ry="4" fill="#FFEEDD" opacity="0.9"/>
  <ellipse cx="114" cy="200" rx="2.5" ry="2" fill="#FFEEDD" opacity="0.4"/>
  <!-- 光晕 -->
  <ellipse cx="108" cy="195" rx="30" ry="32" fill="url(#eyeGlow)"/>

  <!-- 右眼框 -->
  <ellipse cx="152" cy="195" rx="22" ry="24" fill="#1A0E08"/>
  <ellipse cx="152" cy="195" rx="19" ry="21" fill="#2A180E"/>
  <!-- 瞳孔（大） -->
  <ellipse cx="152" cy="195" rx="12" ry="14" fill="#0A0502"/>
  <!-- 高光 -->
  <ellipse cx="146" cy="188" rx="5" ry="4" fill="#FFEEDD" opacity="0.9"/>
  <ellipse cx="158" cy="200" rx="2.5" ry="2" fill="#FFEEDD" opacity="0.4"/>
  <!-- 光晕 -->
  <ellipse cx="152" cy="195" rx="30" ry="32" fill="url(#eyeGlow)"/>

  <!-- 鼻子 -->
  <path d="M 118 235 Q 130 248 142 235" fill="none" stroke="#2E180E" stroke-width="2.5"/>
  <ellipse cx="124" cy="240" rx="6" ry="4" fill="#2E180E"/>
  <ellipse cx="136" cy="240" rx="6" ry="4" fill="#2E180E"/>

  <!-- 嘴线 -->
  <path d="M 112 252 Q 130 262 148 252" fill="none" stroke="#2E180E" stroke-width="2" stroke-linecap="round"/>
</svg>