<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>旧卡存档 · 沙盒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0e9e2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px;color:#1a1a1a}
.box{max-width:600px;margin:0 auto;background:#faf8f5;border-radius:18px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.05)}
.header{background:linear-gradient(135deg,#4a3a2a,#3a2a1a);padding:20px;color:#fff;text-align:center}
.header h1{font-size:18px;font-weight:800;letter-spacing:1px}
.header p{font-size:11px;opacity:.6;margin-top:4px}
.header .badge{display:inline-block;background:rgba(255,255,255,.1);padding:3px 12px;border-radius:4px;font-size:10px;margin-top:8px}
.body{padding:16px 18px}
.body .note{padding:10px 14px;background:#fef6ec;border-radius:10px;font-size:11px;color:#7a5a3a;margin-bottom:14px;border:1px solid #f5ede5}
.body h3{font-size:13px;font-weight:700;color:#3a2a1a;margin-bottom:8px}
.ftr{text-align:center;padding:14px;font-size:10px;color:#b5aaa0}
.back{display:block;text-align:center;padding:10px 0 0}
.back a{color:#C0392B;font-size:11px;font-weight:600;text-decoration:none}
.search-input{width:100%;padding:8px 12px;border:1px solid #e0d8ce;border-radius:8px;font-size:12px;margin-bottom:10px;background:#fff}
.file-list{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.file-list a{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;text-decoration:none;color:#5a4f44;font-size:10px;line-height:1.3}
.file-list a:hover{background:#f5ede5}
.file-list a .fl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <h1>📦 旧卡存档 · 独立沙盒</h1>
    <p>已下架的地摊产品卡 · 仅供存档参考</p>
    <div class="badge">⚠️ 内容可能已过时</div>
  </div>
  <div class="body">
    <div class="note">🔒 这些卡片已从主站下架，移至独立沙盒。内容不作更新，仅供历史查阅。</div>
    <input class="search-input" id="searchInput" placeholder="🔍 搜索存档卡片..." oninput="filterCards(this.value)">
    <div class="file-list" id="fileList"></div>
  </div>
  <div class="back"><a href="../index.html">← 返回主页</a></div>
  <div class="ftr">FoodIntelAI · 存档沙盒</div>
</div>
<script>
const files = [
  "HZ_001_bak.html", "HZ_001_bak2.html",
  "MD_LW_001_桶子鸡门店运营版.html",
  "daokou-shaoji.html", "叫花鸡_郑州版_产品卡.html", "叫花鸡_郑州版_工艺配方文档.html",
  "桶子鸡_产品卡.html", "桶子鸡_配方文档.html", "椒麻鸡_产品卡.html", "椒麻鸡_工艺配方文档.html",
  "沟帮子熏鸡_商业产品卡.html", "茶香鸡_产品卡.html", "酱卤牛肉_产品卡.html", "酱卤牛肉_工艺配方文档.html",
  "麻油鸡_产品卡.html", "麻油鸡_工艺配方文档.html"
];
const list = document.getElementById('fileList');
function render(items){
  list.innerHTML = items.map(f => `<a href="${f}"><span>📄</span><span class="fl-name">${f}</span></a>`).join('');
}
function filterCards(q){
  const ql = q.toLowerCase();
  render(files.filter(f => !ql || f.toLowerCase().includes(ql)));
}
render(files);
</script>
</body>
</html>
