<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=stall.html">
<style>html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
::selection{background:transparent;color:inherit}
::-moz-selection{background:transparent;color:inherit}
</style>
</head><body>
<p>正在跳转... <a href="stall.html">小摊产品库</a></p>
<script>
/* 反复制：禁选择 / 禁全选 / 禁复制剪切 / 禁右键 / 禁拖拽 / 禁查看源码快捷键 */
(function(){var b=function(e){e.preventDefault();return false;};
['selectstart','copy','cut','dragstart','contextmenu'].forEach(function(t){document.addEventListener(t,b,{capture:true,passive:false});});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();
if((e.metaKey||e.ctrlKey)&&['a','c','x','u'].indexOf(k)>=0){e.preventDefault();return false;}},{capture:true});
document.addEventListener('mousedown',function(e){if(e.detail>1)e.preventDefault();},{capture:true});})();
</script>
</body></html>
