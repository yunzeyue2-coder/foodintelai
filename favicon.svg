<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Vora标志：深色底板 + V+A几何标志 -->
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <!-- V形 -->
  <path d="M 8 24 L 16 8 L 24 24" fill="none" stroke="url(#gVora)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A横杠 -->
  <line x1="13.2" y1="19" x2="18.8" y2="19" stroke="url(#gVora)" stroke-width="2.5" stroke-linecap="round"/>
  <defs>
    <linearGradient id="gVora" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
  </defs>
</svg>
