<script>
/* FoodIntelAI 内容保护：禁选中 / 禁全选复制剪切 / 禁右键拖拽 / 禁查看源码与打印 / 长按保护 */
(function(){
  var block=function(e){e.preventDefault();return false;};
  ['selectstart','copy','cut','dragstart','contextmenu','beforeprint'].forEach(function(t){
    document.addEventListener(t,block,{capture:true,passive:false});
  });
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey)&&['a','c','x','u','s','p'].indexOf(k)>=0){e.preventDefault();return false;}
  },{capture:true});
  document.addEventListener('mousedown',function(e){if(e.detail>1)e.preventDefault();},{capture:true});
  /* 移动端长按：清除选区并阻止系统菜单 */
  var clearSel=function(){var s=window.getSelection&&window.getSelection();if(s&&s.removeAllRanges)s.removeAllRanges();};
  document.addEventListener('touchstart',function(){clearSel();},{capture:true,passive:true});
  document.addEventListener('touchend',function(){clearSel();},{capture:true,passive:true});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{capture:true,passive:false});
  /* 复制兜底：即使被绕过，也只复制到出处声明 */
  document.addEventListener('copy',function(e){
    var sel=(window.getSelection&&window.getSelection().toString())||'';
    if(e.clipboardData){e.clipboardData.setData('text/plain',
      (sel.length>20?sel:'')+'\n\n——\n本内容为 FoodIntelAI 产业认知资产，首发于 foodintelai.com，仅供授权使用者阅读。\n转载、摘编、商用须事先获得书面授权。');}
    e.preventDefault();return false;
  },{capture:true});
  /* 阻止拖拽图片与链接 */
  document.addEventListener('dragstart',block,{capture:true});
})();
</script>
