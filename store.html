<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>门店决策卡 · 产品决策库</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png">
<meta name="theme-color" content="#B82C1E">
<meta name="msapplication-TileColor" content="#B82C1E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf4f0;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#7a6a62;
  --light:#b5a098;
  --accent:#B82C1E;
  --accent-light:#D95040;
  --border:#ded0c8;
  --tag-bg:#e8ddd6;
  --radius:14px;
  --shadow:0 3px 14px rgba(0,0,0,.06);
  --shadow-hover:0 8px 28px rgba(0,0,0,.10);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 16px}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px}
.nav-brand{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:6px 10px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:6px;transition:.15s}
.nav-links a:hover{background:var(--tag-bg)}
.nav-links a.active{background:var(--accent);color:#fff;font-weight:600}
.main{max-width:720px;margin:0 auto;padding:0 16px 40px}

/* ===== Hero ===== */
.page-hero{text-align:center;padding:28px 0 12px}
.page-hero h1{font-size:22px;font-weight:800}
.page-hero p{font-size:13px;color:var(--muted);margin-top:4px}

/* ===== 体系总纲入口 ===== */
.outline-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:20px;
  border-left:4px solid var(--accent);
}
.outline-card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.outline-grid{display:flex;flex-wrap:wrap;gap:6px}
.outline-tag{
  padding:6px 12px;
  background:var(--tag-bg);
  border-radius:8px;
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:4px;
}

/* ===== 体系卡片（现代） ===== */
.sys-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:12px;
  overflow:hidden;
  transition:.2s;
  border:1px solid #f0e8e2;
}
.sys-card:hover{box-shadow:var(--shadow-hover)}
.sys-card-header{
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
  transition:.15s;
}
.sys-card-header:hover{background:#f8f2ee}
.sys-card-header .sys-emoji{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.sys-card-header .sys-icon{
  width:36px;height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}
.sys-card-header .sys-info{flex:1;min-width:0}
.sys-card-header .sys-name{font-size:15px;font-weight:700}
.sys-card-header .sys-desc{font-size:11px;color:var(--muted);margin-top:1px}
.sys-card-header .sys-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sys-count{
  font-size:10px;
  padding:2px 8px;
  border-radius:4px;
  background:var(--tag-bg);
  color:var(--muted);
  font-weight:600;
}
.sys-arrow{font-size:14px;color:var(--light);transition:transform .25s ease}
.sys-card.open .sys-arrow{transform:rotate(180deg)}

/* ===== 体系内容区 ===== */
.sys-body{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid var(--border);
}
.sys-card.open .sys-body{display:block}

.sys-type-label{
  font-size:11px;
  font-weight:700;
  padding:6px 0 4px;
  color:var(--muted);
  letter-spacing:2px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}
.sys-type-label::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

/* ===== 卡片网格 ===== */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:6px;
}
.card-chip{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:var(--bg);
  border-radius:10px;
  text-decoration:none;
  color:var(--text);
  font-size:12.5px;
  font-weight:500;
  transition:.15s;
  border:1px solid transparent;
}
.card-chip:hover{background:#f0e8e2;border-color:var(--accent-light);transform:translateY(-1px)}
.card-chip .chip-dot{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.card-chip .chip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-chip .chip-tag{
  font-size:8px;
  font-weight:700;
  padding:1px 5px;
  border-radius:3px;
  flex-shrink:0;
}
.chip-master{background:#B82C1E;color:#fff}
.chip-vc{background:#E04E1A;color:#fff}
.chip-textbook{background:#d4a843;color:#fff}

/* ===== 咨询区 ===== */
.consult-block{
  margin-top:20px;
  padding:18px;
  background:linear-gradient(135deg,#fef2f2,#fce4e4);
  border-radius:var(--radius);
  border:1px solid #f5d0d0;
  text-align:center;
}
.consult-block .cb-title{font-size:14px;font-weight:700;color:#5a2a2a}
.consult-block .cb-desc{font-size:12px;color:var(--muted);margin:6px 0 12px}
.consult-block .cb-btn{
  display:inline-block;
  padding:8px 28px;
  background:var(--accent);
  color:#fff;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  margin:0 4px;
  transition:.15s;
}
.consult-block .cb-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(184,44,30,.25)}
.consult-block .cb-btn.alt{background:#4a2c2c}

.footer{text-align:center;padding:20px 16px 30px;color:var(--muted);font-size:11px;line-height:1.8}
.footer .brand{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:480px){
  .card-grid{grid-template-columns:1fr 1fr}
  .outline-grid{gap:4px}
  .outline-tag{font-size:10px;padding:4px 10px}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">产品决策库</a>
    <div class="nav-links">
      <a href="stall.html">🔥 产品库</a>
      <a href="learn.html">📖 知识库</a>
      <a href="javascript:void(0)" onclick="toggleChat()">🔧 工具</a>
      <a href="index.html#price">👑 会员</a>
    </div>
  </div>
</div>

<div class="main">
  <div class="page-hero">
    <h1>🏪 门店决策卡</h1>
    <p>体系化创业项目 · 总纲→母卡→VC卡 · 每个体系配专属咨询</p>
  </div>

  <!-- 总纲一览 -->
  <div class="outline-card" id="outlineCard">
    <h3>📋 22个体系总览</h3>
    <div class="outline-grid" id="outlineTags"></div>
    <div style="margin-top:10px;font-size:11px;color:var(--muted)">
      总纲<span style="color:var(--accent);font-weight:700">·</span>母卡<span style="color:var(--accent);font-weight:700">·</span>VC卡 三级决策链
    </div>
  </div>

  <!-- 体系渲染区 -->
  <div id="storeCards"></div>

  <!-- 咨询 -->
  <div class="consult-block">
    <div class="cb-title">💼 想开一家店？</div>
    <div class="cb-desc">告诉我你的城市、预算、目标客群，帮你匹配最合适的体系</div>
    <a href="javascript:void(0)" onclick="toggleChat()" class="cb-btn">💬 咨询沧林</a>
    <a href="javascript:void(0)" onclick="copyWxid()" class="cb-btn alt">📱 加微信聊</a>
  </div>
</div>

<div class="footer">
  <div class="brand">产品决策库 · 沧林频道</div>
  <div style="margin-bottom:6px;font-size:11px;color:var(--light)">看见水面之下的力量</div>
  <div><a href="index.html">首页</a> · <a href="stall.html">产品库</a> · <a href="learn.html">知识库</a> · <a href="factory.html">工厂上线</a></div>
  <div style="margin-top:4px;font-size:10px;color:#ccc">微信 canglin1985 · foodintelai.com</div>
</div>

<!-- AI Chat -->
<button class="fab" onclick="toggleChat()" style="position:fixed;bottom:24px;right:24px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;border:none;cursor:pointer;box-shadow:0 3px 12px rgba(184,44,30,.3);z-index:999">🤖</button>
<div class="chat-box" id="chatBox" style="position:fixed;bottom:84px;right:16px;width:320px;max-width:90vw;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:999;display:none;overflow:hidden">
  <div class="chat-head" style="padding:12px 14px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;justify-content:space-between">🤖 沧林门店顾问 <button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer">✕</button></div>
  <div class="chat-msgs" id="chatMsgs" style="padding:12px;max-height:300px;overflow-y:auto;font-size:13px">
    <div style="background:#f0e8e4;padding:10px;border-radius:8px;margin-bottom:8px">👋 想开什么类型的店？烧烤、卤味、火锅还是其他？告诉我预算和城市。</div>
  </div>
  <div class="chat-input" style="display:flex;border-top:1px solid #eee;padding:8px">
    <input type="text" id="chatInput" placeholder="输入问题..." style="flex:1;border:none;padding:8px 10px;font-size:13px;outline:none" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()" style="padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer">发送</button>
  </div>
</div>
<div class="toast" id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:9999;display:none"></div>

<script>
function toggleChat(){var b=document.getElementById('chatBox');b.style.display=b.style.display==='none'||!b.style.display?'block':'none'}
function sendChat(){var i=document.getElementById('chatInput'),q=i.value.trim();if(!q)return;var m=document.getElementById('chatMsgs');m.innerHTML+='<div style="text-align:right;margin:6px 0"><span style="background:#e8d8d0;padding:8px 12px;border-radius:8px;font-size:13px;display:inline-block">'+q+'</span></div>';i.value='';setTimeout(function(){m.innerHTML+='<div style="background:#f0e8e4;padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px">收到！沧林会尽快回复。也可以加微信 canglin1985 直接聊。</div>';m.scrollTop=m.scrollHeight},800);m.scrollTop=m.scrollHeight}
function copyWxid(){var t=document.getElementById('toast');t.textContent='微信已复制：canglin1985';t.style.display='block';setTimeout(function(){t.style.display='none'},2000);navigator.clipboard.writeText('canglin1985')}

// 从 card-catalog.js 渲染（STORE_DATA 已定义）
function renderStore(){
  var el=document.getElementById('storeCards'),html='';
  var outlineEl=document.getElementById('outlineTags'),outlineHtml='';
  if(typeof STORE_DATA==='undefined'){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">⏳ 加载中...</div>';return}
  STORE_DATA.forEach(function(s,i){
    // 图标背景色
    var colors=['#B82C1E','#1a6e3c','#d4a843','#1a6b8e','#8b4a6e','#5a7a3a','#c06030','#3a5a7a','#6a4a3a','#8a3a3a','#3a6a5a','#7a5a3a','#4a6a6a','#6a4a5a','#5a6a4a','#7a4a2a','#4a5a6a','#6a5a4a','#3a4a6a','#5a4a4a','#4a5a3a','#6a3a4a'];
    var bg=colors[i%colors.length];

    // 分类子卡
    var master=[],vc=[],textbook=[];
    (s.c||[]).forEach(function(c){
      var fn=c.f||c.f||'';
      var nm=c.n||fn.replace(/^.*\//,'').replace(/\.html$/,'');
      if(nm.indexOf('母卡')>=0||nm.indexOf('_M01')>=0||nm.indexOf('M01_')>=0||nm.indexOf('_M_')>=0)master.push(c);
      else if(nm.indexOf('总纲')>=0||nm.indexOf('T01')>=0||nm.indexOf('_T01')>=0)textbook.push(c);
      else vc.push(c);
    });

    var cardCount=s.c?s.c.length:0;
    html+='<div class="sys-card" onclick="toggleSys(this)"><div class="sys-card-header"><div class="sys-icon" style="background:'+bg+'22;color:'+bg+'">'+s.e+'</div><div class="sys-info"><div class="sys-name">'+s.n+'</div><div class="sys-desc">'+cardCount+'张卡 · '+(master.length>0?'母卡'+master.length+'张 · ':'')+(vc.length>0?'VC卡'+vc.length+'张':'')+'</div></div><div class="sys-meta"><span class="sys-count">'+cardCount+'张</span><span class="sys-arrow">▾</span></div></div><div class="sys-body">';

    if(textbook.length>0){
      html+='<div class="sys-type-label">📋 总纲</div><div class="card-grid" style="margin-bottom:4px">';
      textbook.forEach(function(c){
        var n=c.n||'';
        html+='<a href="'+c.f+'" class="card-chip"><span class="chip-dot" style="background:#d4a843"></span><span class="chip-name">'+n+'</span><span class="chip-tag chip-textbook">总纲</span></a>';
      });
      html+='</div>';
    }
    if(master.length>0){
      html+='<div class="sys-type-label">📌 母卡</div><div class="card-grid" style="margin-bottom:4px">';
      master.forEach(function(c){
        var n=c.n||'';
        html+='<a href="'+c.f+'" class="card-chip"><span class="chip-dot" style="background:'+bg+'"></span><span class="chip-name">'+n+'</span><span class="chip-tag chip-master">母</span></a>';
      });
      html+='</div>';
    }
    if(vc.length>0){
      html+='<div class="sys-type-label">🔧 VC卡</div><div class="card-grid" style="margin-bottom:4px">';
      vc.forEach(function(c){
        var n=c.n||'';
        html+='<a href="'+c.f+'" class="card-chip"><span class="chip-dot" style="background:#E04E1A"></span><span class="chip-name">'+n+'</span><span class="chip-tag chip-vc">VC</span></a>';
      });
      html+='</div>';
    }
    html+='</div></div>';

    // 总纲标签
    outlineHtml+='<span class="outline-tag" onclick="document.getElementById(\'storeCards\').children['+i+']&&document.getElementById(\'storeCards\').children['+i+'].scrollIntoView({behavior:\'smooth\',block:\'center\'})" style="cursor:pointer">'+s.e+' '+s.n+'</span>';
  });
  el.innerHTML=html;
  if(outlineEl)outlineEl.innerHTML=outlineHtml+'<span class="outline-tag" style="background:var(--accent);color:#fff;cursor:default">共'+STORE_DATA.length+'个体系</span>';
}
function toggleSys(c){c.classList.toggle('open')}
renderStore();
</script>
<script src="card-catalog.js"></script>
</body>
</html>
