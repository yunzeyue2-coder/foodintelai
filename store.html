<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>门店决策 · 产品决策库</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png">
<meta name="theme-color" content="#B82C1E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf4f0;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#7a6a62;
  --light:#b5a098;
  --accent:#B82C1E;
  --border:#ded0c8;
  --tag-bg:#e8ddd6;
  --radius:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 16px}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px}
.nav-brand{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:6px 10px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:6px;transition:.15s}
.nav-links a:hover{background:var(--tag-bg)}
.nav-links a.active{background:var(--accent);color:#fff;font-weight:600}
.main{max-width:720px;margin:0 auto;padding:0 16px 40px}

/* Hero */
.hero{text-align:center;padding:28px 0 12px}
.hero h1{font-size:22px;font-weight:800}
.hero p{font-size:13px;color:var(--muted);margin-top:4px}

/* 统计横条 */
.stats-row{display:flex;gap:8px;margin-bottom:20px}
.stat-block{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-block .num{font-size:22px;font-weight:800;color:var(--accent)}
.stat-block .lb{font-size:11px;color:var(--muted);margin-top:2px}

/* ===== 体系卡片网格 ===== */
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sys-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  overflow:hidden;
  transition:.2s;
}
.sys-card:active{transform:scale(.97)}

/* 卡片头部 */
.sys-top{
  padding:16px 14px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
}
.sys-top .sys-emoji{
  width:44px;height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
}
.sys-top .sys-text{flex:1;min-width:0}
.sys-top .sys-name{font-size:14px;font-weight:700}
.sys-top .sys-count{font-size:11px;color:var(--muted);margin-top:1px}

/* 内容区（默认折叠） */
.sys-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.sys-card.expanded .sys-body{display:block}

/* 子卡列表 */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.sub-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  background:var(--bg);
  border-radius:8px;
  text-decoration:none;
  color:var(--text);
  font-size:11.5px;
  transition:.1s;
}
.sub-item:active{background:var(--tag-bg);transform:scale(.97)}
.sub-item .sub-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.sub-item .sub-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 咨询区 */
.consult{margin-top:20px;padding:16px;background:linear-gradient(135deg,#fef2f2,#fce4e4);border-radius:var(--radius);text-align:center}
.consult .ct{font-size:13px;font-weight:700;color:#5a2a2a}
.consult .cd{font-size:11px;color:var(--muted);margin:6px 0 10px}
.consult .cb{display:inline-block;padding:8px 24px;background:var(--accent);color:#fff;border-radius:10px;font-size:12px;font-weight:600;text-decoration:none;margin:0 4px}

.footer{text-align:center;padding:20px 16px 30px;color:var(--muted);font-size:11px;line-height:1.8}
.footer .brand{font-size:14px;font-weight:700;color:var(--text)}
.footer a{color:var(--accent);text-decoration:none}

@media(max-width:400px){
  .sys-grid{grid-template-columns:1fr}
  .sub-grid{grid-template-columns:1fr}
  .stats-row{gap:4px}
  .stat-block .num{font-size:18px}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">产品决策库</a>
    <div class="nav-links">
      <a href="stall.html">🔥 产品库</a>
      <a href="javascript:void(0)" onclick="toggleChat()">🔧 工具</a>
      <a href="index.html#price">👑 会员</a>
    </div>
  </div>
</div>

<div class="main">

  <div class="hero">
    <h1>🏪 门店决策</h1>
    <p>体系化创业 · 总纲→母卡→VC卡 · 三级决策链</p>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="sys-grid" id="sysGrid"></div>

  <div class="consult">
    <div class="ct">💼 想开一家店？</div>
    <div class="cd">告诉我城市、预算、客群，推荐最合适的体系</div>
    <a href="javascript:void(0)" onclick="toggleChat()" class="cb">💬 咨询沧林</a>
    <a href="javascript:void(0)" onclick="copyWxid()" class="cb" style="background:#5a3a3a">📱 加微信</a>
  </div>

</div>

<div class="footer">
  <div class="brand">产品决策库 · 沧林频道</div>
  <div style="font-size:11px;color:var(--light);margin-bottom:4px">看见水面之下的力量</div>
  <div><a href="index.html">首页</a> · <a href="stall.html">产品库</a> · <a href="factory.html">工厂上线</a></div>
</div>

<script>
function toggleChat(){alert('💬 咨询沧林请加微信 canglin1985')}
function copyWxid(){navigator.clipboard.writeText('canglin1985');alert('微信已复制：canglin1985')}

var SYS_DATA=[],colors=['#B82C1E','#1a7a4a','#c49a3e','#1a7a8e','#8b4a6e','#5a8a3a','#c0703a','#3a6a7a','#6a4a3a','#8a3a3a','#3a7a5a','#7a5a3a','#4a7a6a','#7a4a5a','#5a7a4a','#7a4a2a','#4a6a7a','#7a5a4a','#3a4a7a','#5a4a4a','#4a6a3a','#7a3a4a'];

function render(){
  if(typeof STORE_DATA==='undefined'){document.getElementById('sysGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">⏳ 加载中...</div>';return}
  SYS_DATA=STORE_DATA;

  // Stats
  var total=0,ms=0,vc=0;
  SYS_DATA.forEach(function(s){(s.c||[]).forEach(function(c){
    total++;var n=c.n||'';
    if(n.indexOf('母卡')>=0||n.indexOf('_M01')>=0||n.indexOf('M01_')>=0||n.indexOf('_M_')>=0)ms++;
    else if(n.indexOf('总纲')>=0||n.indexOf('T01')>=0||n.indexOf('_T01')>=0){}
    else vc++;
  })});
  document.getElementById('statsRow').innerHTML='<div class="stat-block"><div class="num">'+SYS_DATA.length+'</div><div class="lb">体系</div></div><div class="stat-block"><div class="num">'+total+'</div><div class="lb">决策卡</div></div><div class="stat-block"><div class="num">'+ms+'</div><div class="lb">母卡</div></div><div class="stat-block"><div class="num">'+vc+'</div><div class="lb">VC卡</div></div>';

  // Cards
  var html='';
  SYS_DATA.forEach(function(s,i){
    var c=colors[i%colors.length], bg=c+'18';

    // 分类
    var master=[],vcards=[],textbook=[];
    (s.c||[]).forEach(function(card){
      var nm=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');
      if(nm.indexOf('母卡')>=0||nm.indexOf('_M01')>=0||nm.indexOf('M01_')>=0)master.push(card);
      else if(nm.indexOf('总纲')>=0||nm.indexOf('T01')>=0||nm.indexOf('_T01')>=0)textbook.push(card);
      else vcards.push(card);
    });

    html+='<div class="sys-card"><div class="sys-top" onclick="toggleSys(this)"><div class="sys-emoji" style="background:'+bg+';color:'+c+'">'+s.e+'</div><div class="sys-text"><div class="sys-name">'+s.n+'</div><div class="sys-count">'+(s.c?s.c.length:0)+'张决策卡</div></div></div>';

    html+='<div class="sys-body">';
    if(textbook.length>0){
      html+='<div style="font-size:10px;font-weight:700;color:#c49a3e;margin-top:8px;margin-bottom:2px">📋 总纲</div><div class="sub-grid">';
      textbook.forEach(function(card){
        var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');
        html+='<a href="'+card.f+'" class="sub-item"><span class="sub-dot" style="background:#c49a3e"></span><span class="sub-name">'+n+'</span></a>';
      });
      html+='</div>';
    }
    if(master.length>0){
      html+='<div style="font-size:10px;font-weight:700;color:'+c+';margin-top:8px;margin-bottom:2px">📌 母卡</div><div class="sub-grid">';
      master.forEach(function(card){
        var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');
        html+='<a href="'+card.f+'" class="sub-item"><span class="sub-dot" style="background:'+c+'"></span><span class="sub-name">'+n+'</span></a>';
      });
      html+='</div>';
    }
    if(vcards.length>0){
      html+='<div style="font-size:10px;font-weight:700;color:var(--muted);margin-top:8px;margin-bottom:2px">🔧 VC子卡</div><div class="sub-grid">';
      vcards.forEach(function(card){
        var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');
        html+='<a href="'+card.f+'" class="sub-item"><span class="sub-dot" style="background:#E04E1A"></span><span class="sub-name">'+n+'</span></a>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });
  document.getElementById('sysGrid').innerHTML=html;
}

function toggleSys(el){
  var card=el.closest('.sys-card');
  card.classList.toggle('expanded');
}

render();
</script>
<script src="card-catalog.js"></script>
</body>
</html>
