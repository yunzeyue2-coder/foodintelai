<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>门店决策卡 · 产品决策库</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png">
<meta name="theme-color" content="#C0392B">
<meta name="msapplication-TileColor" content="#C0392B">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5efec;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#7a6a62;
  --light:#b5a098;
  --accent:#C0392B;
  --accent-light:#D96050;
  --border:#e0d0c8;
  --tag-bg:#e8d8d0;
  --radius:12px;
  --shadow:0 2px 10px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:50;background:rgba(245,239,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 16px}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px}
.nav-brand{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:6px 10px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:6px}
.nav-links a:hover{background:var(--tag-bg)}
.nav-links a.active{background:var(--accent);color:#fff;font-weight:600}
.main{max-width:720px;margin:0 auto;padding:0 16px 40px}
.section-header{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 12px;padding-bottom:8px;border-bottom:1.5px solid var(--border)}
.section-header h2{font-size:17px;font-weight:700}
.section-header .more{font-size:12px;color:var(--muted)}
.system-card{margin-bottom:10px;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.system-card .sc-header{padding:12px 14px;font-size:14px;font-weight:700;color:#3a2a1a;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.system-card .sc-header .sc-emoji{font-size:20px}
.system-card .sc-header .sc-name{flex:1}
.system-card .sc-header .sc-count{font-size:11px;color:var(--light)}
.system-card .sc-header .sc-arrow{font-size:10px;color:var(--light);transition:transform .2s}
.system-card .sc-body{padding:0 14px 14px;display:block}
.system-card .sc-body.hide{display:none}
.list-grid{display:flex;flex-direction:column;gap:2px}
.list-row{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;text-decoration:none;color:var(--text);font-size:12px}
.list-row:hover{background:var(--tag-bg)}
.list-row .lr-tag{font-size:9px;font-weight:700;color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.list-row .lr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-arrow{color:var(--light);flex-shrink:0;font-size:13px}
.consult-block{margin-top:16px;padding:14px;background:linear-gradient(135deg,#fef2f2,#fce4e4);border-radius:var(--radius);border:1px solid #f5d0d0;text-align:center}
.consult-block .cb-title{font-size:13px;font-weight:700;color:#5a2a2a}
.consult-block .cb-desc{font-size:11px;color:var(--muted);margin:6px 0 10px}
.consult-block .cb-btn{display:inline-block;padding:7px 24px;background:var(--accent);color:#fff;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;margin:0 4px}
.footer{text-align:center;padding:20px 16px 30px;color:var(--muted);font-size:11px;line-height:1.8}
.footer .brand{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">产品决策库</a>
    <div class="nav-links">
      <a href="stall.html">🔥 产品库</a>
      <a href="learn.html">📖 知识库</a>
      <a href="javascript:void(0)" onclick="toggleChat()">🔧 工具</a>
      <a href="index.html#price">👑 会员</a>
    </div>
  </div>
</div>

<div class="main">
  <div style="padding:24px 0 8px;text-align:center">
    <h1 style="font-size:22px;font-weight:800">🏪 门店决策卡</h1>
    <p style="font-size:13px;color:var(--muted);margin-top:4px">体系化创业项目 · 总纲 → 母卡 → VC卡 · 每个体系配专属咨询</p>
  </div>

  <div id="storeCards"></div>

  <div class="consult-block" style="margin-top:20px">
    <div class="cb-title">💼 想开一家店？</div>
    <div class="cb-desc">告诉我你的城市、预算、目标客群，帮你匹配最合适的体系</div>
    <a href="javascript:void(0)" onclick="toggleChat()" class="cb-btn">💬 咨询沧林</a>
    <a href="javascript:void(0)" onclick="copyWxid()" class="cb-btn" style="background:#5a3a3a">📱 加微信聊</a>
  </div>
</div>

<div class="footer">
  <div class="brand">产品决策库 · 沧林频道</div>
  <div style="margin-bottom:6px;font-size:11px;color:var(--light)">看见水面之下的力量</div>
  <div><a href="index.html">首页</a> · <a href="stall.html">地摊产品</a> · <a href="learn.html">知识库</a> · <a href="factory.html">工厂上线</a></div>
  <div style="margin-top:4px;font-size:10px;color:#ccc">微信 canglin1985 · foodintelai.com</div>
</div>

<!-- AI Chat -->
<button class="fab" id="fabBtn" onclick="toggleChat()" style="position:fixed;bottom:24px;right:24px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;border:none;cursor:pointer;box-shadow:0 3px 12px rgba(192,57,43,.3);z-index:999">🤖</button>
<div class="chat-box" id="chatBox" style="position:fixed;bottom:84px;right:16px;width:320px;max-width:90vw;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:999;display:none;overflow:hidden">
  <div class="chat-head" style="padding:12px 14px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;justify-content:space-between">🤖 沧林门店顾问 <button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer">✕</button></div>
  <div class="chat-msgs" id="chatMsgs" style="padding:12px;max-height:300px;overflow-y:auto;font-size:13px">
    <div style="background:#f0e8e4;padding:10px;border-radius:8px;margin-bottom:8px">👋 想开什么类型的店？烧烤、卤味、火锅还是其他？告诉我预算和城市。</div>
  </div>
  <div class="chat-input" style="display:flex;border-top:1px solid #eee;padding:8px">
    <input type="text" id="chatInput" placeholder="输入问题..." style="flex:1;border:none;padding:8px 10px;font-size:13px;outline:none" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()" style="padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer">发送</button>
  </div>
</div>
<div class="toast" id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:9999;display:none"></div>

<script>
function toggleChat(){var b=document.getElementById('chatBox');b.style.display=b.style.display==='none'||!b.style.display?'block':'none'}
function sendChat(){var i=document.getElementById('chatInput'),q=i.value.trim();if(!q)return;var m=document.getElementById('chatMsgs');m.innerHTML+='<div style="text-align:right;margin:6px 0"><span style="background:#e8d8d0;padding:8px 12px;border-radius:8px;font-size:13px;display:inline-block">'+q+'</span></div>';i.value='';setTimeout(function(){m.innerHTML+='<div style="background:#f0e8e4;padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px">收到！沧林会尽快回复。也可以加微信 canglin1985 直接聊。</div>';m.scrollTop=m.scrollHeight},800);m.scrollTop=m.scrollHeight}
function copyWxid(){var t=document.getElementById('toast');t.textContent='微信已复制：canglin1985';t.style.display='block';setTimeout(function(){t.style.display='none'},2000);navigator.clipboard.writeText('canglin1985')}
</script>
<script src="card-catalog.js"></script>
</body>
</html>
