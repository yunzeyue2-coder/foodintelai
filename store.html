<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>门店决策 · 产品决策库</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png">
<meta name="theme-color" content="#B82C1E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf4f0;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#7a6a62;
  --light:#b5a098;
  --accent:#B82C1E;
  --border:#ded0c8;
  --tag-bg:#e8ddd6;
  --radius:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,244,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 16px}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px}
.nav-brand{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:6px 10px;font-size:12px;color:var(--muted);text-decoration:none;border-radius:6px;transition:.15s}
.nav-links a:hover{background:var(--tag-bg)}
.nav-links a.active{background:var(--accent);color:#fff;font-weight:600}
.main{max-width:720px;margin:0 auto;padding:0 16px 40px}

/* Hero */
.hero{text-align:center;padding:28px 0 12px}
.hero h1{font-size:22px;font-weight:800}
.hero p{font-size:13px;color:var(--muted);margin-top:4px}

/* 统计横条 */
.stats-row{display:flex;gap:8px;margin-bottom:20px}
.stat-block{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-block .num{font-size:22px;font-weight:800;color:var(--accent)}
.stat-block .lb{font-size:11px;color:var(--muted);margin-top:2px}

/* ===== 体系卡片网格 ===== */
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sys-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  overflow:hidden;
  transition:box-shadow .3s;
}
.sys-card.expanded{box-shadow:0 4px 20px rgba(0,0,0,.08)}

/* 卡片头部 */
.sys-top{
  padding:16px 14px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
}
.sys-top:hover{background:#f8f2ee}
.sys-top .sys-emoji{
  width:44px;height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
  transition:transform .3s ease;
}
.sys-card.expanded .sys-emoji{transform:scale(1.05)}
.sys-top .sys-text{flex:1;min-width:0}
.sys-top .sys-name{font-size:14px;font-weight:700}
.sys-top .sys-count{font-size:11px;color:var(--muted);margin-top:1px}

/* ===== 心智图展开 ===== */
.sys-body{
  position:relative;
  padding:0 14px 0 28px;
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s cubic-bezier(0.4,0,0.2,1);
}
.sys-card.expanded .sys-body{
  max-height:800px;
  border-top:1px solid var(--border);
  padding-top:6px;
  padding-bottom:14px;
}

/* 树干竖线 */
.sys-body::before{
  content:'';
  position:absolute;
  left:14px;
  top:12px;
  bottom:14px;
  width:2px;
  background:linear-gradient(to bottom,var(--border),var(--accent-light));
  border-radius:1px;
}

/* 树节点（每个分类区块） */
.tree-node{
  position:relative;
  padding-left:16px;
  margin-top:8px;
  opacity:0;
  transform:translateY(-6px);
  animation:treeSlideIn 0.35s ease forwards;
}
/* 横向连接线 */
.tree-node::before{
  content:'';
  position:absolute;
  left:-16px;
  top:10px;
  width:16px;
  height:2px;
  background:var(--border);
  border-radius:1px;
}
.tree-node:first-child{margin-top:2px}

.tree-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:4px;
}
.tree-label .tl-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* 树节点内的叶子逐条滑入 */
.tree-leaf{
  display:block;
  padding:6px 10px;
  font-size:11.5px;
  color:var(--text);
  text-decoration:none;
  border-radius:6px;
  transition:.15s;
  margin-bottom:2px;
  opacity:0;
  transform:translateX(-4px);
  animation:leafFadeIn 0.25s ease forwards;
}
.tree-leaf:hover{background:var(--tag-bg);padding-left:14px}
.tree-leaf .tl-arrow{color:var(--light);margin-left:4px;font-size:10px}

@keyframes treeSlideIn{
  0%{opacity:0;transform:translateY(-8px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes leafFadeIn{
  0%{opacity:0;transform:translateX(-6px)}
  100%{opacity:1;transform:translateX(0)}
}

/* 咨询区 */
.consult{margin-top:20px;padding:16px;background:linear-gradient(135deg,#fef2f2,#fce4e4);border-radius:var(--radius);text-align:center}
.consult .ct{font-size:13px;font-weight:700;color:#5a2a2a}
.consult .cd{font-size:11px;color:var(--muted);margin:6px 0 10px}
.consult .cb{display:inline-block;padding:8px 24px;background:var(--accent);color:#fff;border-radius:10px;font-size:12px;font-weight:600;text-decoration:none;margin:0 4px}

.footer{text-align:center;padding:20px 16px 30px;color:var(--muted);font-size:11px;line-height:1.8}
.footer .brand{font-size:14px;font-weight:700;color:var(--text)}
.footer a{color:var(--accent);text-decoration:none}

@media(max-width:400px){
  .sys-grid{grid-template-columns:1fr}
  .stats-row{gap:4px}
  .stat-block .num{font-size:18px}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">产品决策库</a>
  </div>
</div>

<div class="main">

  <div class="hero">
    <h1>🏪 门店决策</h1>
    <p>体系化创业 · 总纲→母卡→VC卡 · 三级决策链</p>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="sys-grid" id="sysGrid"></div>

  <div class="consult">
    <div class="ct">💼 想开一家店？</div>
    <div class="cd">告诉我城市、预算、客群，推荐最合适的体系</div>
    <a href="javascript:void(0)" onclick="toggleChat()" class="cb">💬 咨询沧林</a>
    <a href="javascript:void(0)" onclick="copyWxid()" class="cb" style="background:#5a3a3a">📱 加微信</a>
  </div>

</div>

<div class="footer">
  <div class="brand">产品决策库 · 沧林频道</div>
  <div style="font-size:11px;color:var(--light);margin-bottom:4px">看见水面之下的力量</div>
  <div><a href="index.html">首页</a> · <a href="stall.html">产品库</a> · <a href="factory.html">工厂上线</a></div>
</div>

<script>
function toggleChat(){alert('💬 咨询沧林请加微信 canglin1985')}
function copyWxid(){navigator.clipboard.writeText('canglin1985');alert('微信已复制：canglin1985')}
</script>
<script src="card-catalog.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
var colors=['#B82C1E','#1a7a4a','#c49a3e','#1a7a8e','#8b4a6e','#5a8a3a','#c0703a','#3a6a7a','#6a4a3a','#8a3a3a','#3a7a5a','#7a5a3a','#4a7a6a','#7a4a5a','#5a7a4a','#7a4a2a','#4a6a7a','#7a5a4a','#3a4a7a','#5a4a4a','#4a6a3a','#7a3a4a'];

function render(){
  if(typeof STORE_DATA==='undefined'){document.getElementById('sysGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">⏳ 加载中...</div>';return}
  var SYS_DATA=STORE_DATA;
  var total=0,ms=0,vc=0;
  SYS_DATA.forEach(function(s){(s.c||[]).forEach(function(c){
    total++;var n=c.n||'';
    if(n.indexOf('母卡')>=0||n.indexOf('_M01')>=0||n.indexOf('M01_')>=0||n.indexOf('_M_')>=0)ms++;
    else if(n.indexOf('总纲')>=0||n.indexOf('T01')>=0||n.indexOf('_T01')>=0){}
    else vc++;
  })});
  document.getElementById('statsRow').innerHTML='<div class="stat-block"><div class="num">'+SYS_DATA.length+'</div><div class="lb">体系</div></div><div class="stat-block"><div class="num">'+total+'</div><div class="lb">决策卡</div></div><div class="stat-block"><div class="num">'+ms+'</div><div class="lb">母卡</div></div><div class="stat-block"><div class="num">'+vc+'</div><div class="lb">VC卡</div></div>';
  var html='';
  SYS_DATA.forEach(function(s,i){
    var c=colors[i%colors.length], bg=c+'18';
    var master=[],vcards=[],textbook=[];
    (s.c||[]).forEach(function(card){
      var nm=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');
      if(nm.indexOf('母卡')>=0||nm.indexOf('_M01')>=0||nm.indexOf('M01_')>=0)master.push(card);
      else if(nm.indexOf('总纲')>=0||nm.indexOf('T01')>=0||nm.indexOf('_T01')>=0)textbook.push(card);
      else vcards.push(card);
    });
    html+='<div class="sys-card"><div class="sys-top" onclick="toggleSys(this)"><div class="sys-emoji" style="background:'+bg+';color:'+c+'">'+s.e+'</div><div class="sys-text"><div class="sys-name">'+s.n+'</div><div class="sys-count">'+(s.c?s.c.length:0)+'张决策卡</div></div></div>';
    html+='<div class="sys-body">';
    if(textbook.length>0){
      html+='<div class="tree-node" style="animation-delay:0.1s"><div class="tree-label"><span class="tl-dot" style="background:#c49a3e"></span>总纲</div>';
      textbook.forEach(function(card,i){var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');html+='<a href="'+card.f+'" class="tree-leaf" style="animation-delay:'+(0.2+i*0.08)+'s">'+n+'<span class="tl-arrow">→</span></a>';});
      html+='</div>';
    }
    if(master.length>0){
      html+='<div class="tree-node" style="animation-delay:0.4s"><div class="tree-label"><span class="tl-dot" style="background:'+c+'"></span>母卡</div>';
      master.forEach(function(card,i){var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');html+='<a href="'+card.f+'" class="tree-leaf" style="animation-delay:'+(0.5+i*0.08)+'s">'+n+'<span class="tl-arrow">→</span></a>';});
      html+='</div>';
    }
    if(vcards.length>0){
      html+='<div class="tree-node" style="animation-delay:0.7s"><div class="tree-label"><span class="tl-dot" style="background:#E8652D"></span>VC子卡</div>';
      vcards.forEach(function(card,i){var n=(card.n||card.f||'').replace(/^.*\//,'').replace(/\.html$/,'');html+='<a href="'+card.f+'" class="tree-leaf" style="animation-delay:'+(0.8+i*0.08)+'s">'+n+'<span class="tl-arrow">→</span></a>';});
      html+='</div>';
    }
    html+='</div></div>';
  });
  document.getElementById('sysGrid').innerHTML=html;
}

function toggleSys(el){el.closest('.sys-card').classList.toggle('expanded')}
render();
});
</script>
</body>
</html>
