<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>登录 · FoodIntel AI · 食品创业决策系统</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0e9e2;
  --card:#faf8f5;
  --text:#1a1a1a;
  --muted:#7a7269;
  --light:#b5aaa0;
  --accent:#C0392B;
  --accent-light:#E8652D;
  --green:#07C160;
  --border:#ddd4ca;
  --tag-bg:#e8dfd5;
  --radius:14px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
.login-card{
  max-width:400px;
  width:100%;
  background:var(--card);
  border-radius:20px;
  padding:36px 28px 32px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);
  text-align:center;
}
.logo{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:24px;
  font-weight:600;
  color:#111;
  margin-bottom:4px;
}
.logo span{color:#6B7280;font-weight:400}
.tagline{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.tagline strong{color:var(--accent-light);font-weight:600}

/* 统计数字 */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:24px;
}
.stat{
  padding:10px 4px;
  background:var(--bg);
  border-radius:10px;
}
.stat .num{font-size:20px;font-weight:800;color:var(--accent-light)}
.stat .lb{font-size:9px;color:var(--muted);margin-top:2px}

/* 登录方式 */
.login-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
}
.login-btn.primary{
  background:var(--accent);
  color:#fff;
  margin-bottom:10px;
}
.login-btn.primary:hover{background:#a83228}
.login-btn.ghost{
  background:var(--tag-bg);
  color:var(--text);
  margin-bottom:16px;
}
.login-btn.ghost:hover{background:#d5cbc0}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
  font-size:11px;
  color:var(--light);
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.features{
  text-align:left;
  margin-bottom:20px;
}
.feature{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 0;
  font-size:12px;
  color:var(--muted);
}
.feature .icon{font-size:14px;flex-shrink:0}

.footer-links{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:16px;
  font-size:11px;
  color:var(--light);
}
.footer-links a{color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--accent)}

/* 免费7样入口 */
.free-badge{
  display:inline-block;
  background:#fef2ee;
  color:var(--accent);
  font-size:10px;
  font-weight:700;
  padding:3px 10px;
  border-radius:4px;
  margin-bottom:12px;
}

/* 手机号输入 */
.input-group{
  text-align:left;
  margin-bottom:12px;
}
.input-group label{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}
.input-group input{
  width:100%;
  padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:14px;
  background:var(--card);
  color:var(--text);
  outline:none;
  transition:.2s;
}
.input-group input:focus{border-color:var(--accent)}

@media(max-width:420px){
  .login-card{padding:28px 20px 24px}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">FoodIntel <span>AI</span></div>
  <div class="tagline"><strong>食品创业决策系统</strong><br>少走弯路，快人一步</div>

  <div class="stats">
    <div class="stat">
      <div class="num">509</div>
      <div class="lb">产品配方卡</div>
    </div>
    <div class="stat">
      <div class="num">31</div>
      <div class="lb">热门品类</div>
    </div>
    <div class="stat">
      <div class="num">13</div>
      <div class="lb">门店模型</div>
    </div>
  </div>

  <div class="free-badge">🎁 免费体验 7 款爆品</div>

  <a href="index.html" class="login-btn primary">
    🔓 免费进入主页
  </a>

  <a href="decision-engine.html" class="login-btn ghost">
    🏪 查看门店决策引擎
  </a>

  <div class="divider">或</div>

  <div class="input-group">
    <label>📱 手机号（下次自动登录）</label>
    <input type="tel" placeholder="请输入手机号" maxlength="11">
  </div>
  <a href="index.html" class="login-btn primary" style="opacity:.7;margin-bottom:16px;pointer-events:none">
    登录 · 暂未开放
  </a>

  <div class="features">
    <div class="feature"><span class="icon">✅</span> 509 张真实配方产品卡，精确到克</div>
    <div class="feature"><span class="icon">✅</span> 31 个热门品类，覆盖摆摊到门店</div>
    <div class="feature"><span class="icon">✅</span> 门店决策引擎：选品类·估投入·算回本</div>
    <div class="feature"><span class="icon">✅</span> 开店手册：时间轴·选址评分·运营手册</div>
  </div>

  <div class="footer-links">
    <a href="index.html">进入主页</a>
    <a href="learn.html">入门指南</a>
    <a href="free.html">限免专区</a>
  </div>
</div>

</body>
</html>
