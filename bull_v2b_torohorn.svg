<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480">
  <!-- 方案B：斗牛角 — 粗壮V形向上，充满力量感 -->
  <defs>
    <linearGradient id="hornGradB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6B5B3E"/>
      <stop offset="50%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#B8A080"/>
    </linearGradient>
    <linearGradient id="faceGradB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A3020"/>
      <stop offset="100%" stop-color="#6B4C3A"/>
    </linearGradient>
  </defs>
  
  <!-- 斗牛角特征：粗壮V形，从头顶向两侧展开，向上弯-->
  <!-- 左角：粗壮有力 -->
  <path d="M 78 130 
           C 70 115, 52 85, 44 60 
           C 40 48, 42 38, 48 32
           C 52 38, 54 50, 58 65
           C 62 82, 70 100, 76 118
           C 78 124, 80 130, 78 130" 
        fill="url(#hornGradB)" stroke="#5A4A30" stroke-width="1.5"/>
  
  <!-- 右角 -->
  <path d="M 122 130 
           C 130 115, 148 85, 156 60 
           C 160 48, 158 38, 152 32
           C 148 38, 146 50, 142 65
           C 138 82, 130 100, 124 118
           C 122 124, 120 130, 122 130" 
        fill="url(#hornGradB)" stroke="#5A4A30" stroke-width="1.5"/>
  
  <!-- 牛脸（斗牛更宽） -->
  <path d="M 70 130 L 68 202 Q 100 218 132 202 L 130 130 Q 100 118 70 130" 
        fill="url(#faceGradB)" stroke="#3D2218" stroke-width="1.5"/>
  
  <!-- 眼睛 -->
  <ellipse cx="85" cy="155" rx="8" ry="9" fill="#1A0E08"/>
  <ellipse cx="115" cy="155" rx="8" ry="9" fill="#1A0E08"/>
  <ellipse cx="86" cy="153" rx="3" ry="3" fill="white" opacity="0.5"/>
  <ellipse cx="116" cy="153" rx="3" ry="3" fill="white" opacity="0.5"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="192" rx="14" ry="6" fill="#3D2218"/>
  <ellipse cx="95" cy="193" rx="3" ry="2.5" fill="#1A0E08"/>
  <ellipse cx="105" cy="193" rx="3" ry="2.5" fill="#1A0E08"/>
</svg>