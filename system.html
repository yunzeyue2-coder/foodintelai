<title>体系卡 · 食品决策库</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f0e8;
  --card:#fcfaf7;
  --text:#1a1a1a;
  --muted:#7a6e60;
  --light:#b5a898;
  --accent:#C0392B;
  --accent-light:#E8652D;
  --border:#d8ccbc;
  --tag-bg:#e8dcc8;
  --radius-xl:20px;
  --radius-md:12px;
  --radius-sm:8px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:600px;margin:0 auto;padding:0 16px 40px}

/* ===== 体系头部 ===== */
.sys-header{
  background:var(--card);
  border-radius:var(--radius-xl);
  padding:28px 24px 22px;
  margin:20px 0 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
  text-align:center;
  position:relative;
}
.sys-emoji{
  font-size:42px;
  display:block;
  margin-bottom:6px;
}
.sys-name{
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}
.sys-count{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  letter-spacing:1px;
}
.sys-back{
  position:absolute;
  left:16px;
  top:16px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:var(--muted);
  font-size:18px;
  transition:.2s;
}
.sys-back:hover{background:var(--tag-bg);color:var(--accent)}

/* ===== 卡片列表 ===== */
.card-list{display:grid;gap:8px}

.card-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:var(--card);
  border-radius:var(--radius-md);
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--border);
  transition:.2s;
}
.card-item:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  border-color:var(--accent-light);
}
.card-item .ci-tag{
  font-size:10px;
  font-weight:700;
  color:#fff;
  padding:2px 8px;
  border-radius:4px;
  flex-shrink:0;
  line-height:1.5;
}
.card-item .ci-name{
  flex:1;
  font-size:14px;
  font-weight:600;
  line-height:1.3;
}
.card-item .ci-arrow{
  color:var(--light);
  font-size:18px;
  flex-shrink:0;
  transition:.2s;
}
.card-item:hover .ci-arrow{
  color:var(--accent);
  transform:translateX(3px);
}

/* ===== 加载中 ===== */
.loading{
  text-align:center;
  padding:60px 0;
  color:var(--muted);
  font-size:14px;
}
.loading .spinner{
  display:inline-block;
  width:28px;height:28px;
  border:3px solid var(--tag-bg);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 空状态 ===== */
.empty-state{
  text-align:center;
  padding:40px 0;
  color:var(--muted);
  font-size:14px;
}
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
::selection{background:transparent;color:inherit}
::-moz-selection{background:transparent;color:inherit}
</style>

<body>
<div class="page">
  <div class="sys-header" id="sysHeader">
    <a class="sys-back" href="store.html" aria-label="返回">←</a>
    <span class="sys-emoji" id="sysEmoji">🍗</span>
    <div class="sys-name" id="sysName">加载中...</div>
    <div class="sys-count" id="sysCount">—</div>
  </div>
  <div class="card-list" id="cardList"></div>
</div>

<script src="card-catalog.js"></script>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || 'SL';

  var emojiEl = document.getElementById('sysEmoji');
  var nameEl = document.getElementById('sysName');
  var countEl = document.getElementById('sysCount');
  var listEl = document.getElementById('cardList');

  if(typeof STORE_DATA === 'undefined'){
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div>体系加载中</div>';
    return;
  }

  var found = null;
  STORE_DATA.forEach(function(d){if(d.p === id) found=d;});
  if(!found){
    nameEl.textContent = '未找到该体系';
    countEl.textContent = '—';
    listEl.innerHTML = '<div class="empty-state">😕 暂未收录该体系卡片</div>';
    return;
  }

  emojiEl.textContent = found.e;
  nameEl.textContent = found.n;
  countEl.textContent = found.c.length + '张卡片';

  var html = '';
  found.c.forEach(function(c, idx){
    var tag = '';
    if(c.n.indexOf('（母）')>-1 || c.n.indexOf('母卡')>-1) tag = '母';
    else if(c.n.indexOf('（子）')>-1 || c.n.indexOf('(子)')>-1) tag = '子';
    var tagColor = tag==='母' ? '#C0392B' : '#E8652D';

    // 清洗显示名
    var name = c.n
      .replace(/^[A-Z0-9_]+ /,'')  // 去掉编号前缀
      .replace(/（[^）]*）/g,'')    // 去掉中文括号内容
      .replace(/\([^)]*\)/g,'');    // 去掉英文括号内容

    var tagHtml = tag ? '<span class="ci-tag" style="background:'+tagColor+'">'+tag+'</span>' : '';
    html += '<a class="card-item" href="'+c.f+'">'
      + tagHtml
      + '<span class="ci-name">'+name+'</span>'
      + '<span class="ci-arrow">›</span>'
      + '</a>';
  });
  listEl.innerHTML = html;
})();
</script>

<script>
/* FoodIntelAI 内容保护：禁选中 / 禁全选复制剪切 / 禁右键拖拽 / 禁查看源码与打印 / 长按保护 */
(function(){
  var block=function(e){e.preventDefault();return false;};
  ['selectstart','copy','cut','dragstart','contextmenu','beforeprint'].forEach(function(t){
    document.addEventListener(t,block,{capture:true,passive:false});
  });
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey)&&['a','c','x','u','s','p'].indexOf(k)>=0){e.preventDefault();return false;}
  },{capture:true});
  document.addEventListener('mousedown',function(e){if(e.detail>1)e.preventDefault();},{capture:true});
  /* 移动端长按：清除选区并阻止系统菜单 */
  var clearSel=function(){var s=window.getSelection&&window.getSelection();if(s&&s.removeAllRanges)s.removeAllRanges();};
  document.addEventListener('touchstart',function(){clearSel();},{capture:true,passive:true});
  document.addEventListener('touchend',function(){clearSel();},{capture:true,passive:true});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{capture:true,passive:false});
  /* 复制兜底：即使被绕过，也只复制到出处声明 */
  document.addEventListener('copy',function(e){
    var sel=(window.getSelection&&window.getSelection().toString())||'';
    if(e.clipboardData){e.clipboardData.setData('text/plain',
      (sel.length>20?sel:'')+'\n\n——\n本内容为 FoodIntelAI 产业认知资产，首发于 foodintelai.com，仅供授权使用者阅读。\n转载、摘编、商用须事先获得书面授权。');}
    e.preventDefault();return false;
  },{capture:true});
  /* 阻止拖拽图片与链接 */
  document.addEventListener('dragstart',block,{capture:true});
})();
</script>
