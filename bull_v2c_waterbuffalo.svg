<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480">
  <!-- 方案C：水牛角 — 月牙形向后弯再向上，最标志性的牛角形状 -->
  <defs>
    <linearGradient id="hornGradC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5A4A30"/>
      <stop offset="40%" stop-color="#7A6548"/>
      <stop offset="100%" stop-color="#A08860"/>
    </linearGradient>
    <linearGradient id="faceGradC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3D281E"/>
      <stop offset="100%" stop-color="#5C4033"/>
    </linearGradient>
  </defs>
  
  <!-- 水牛角特征：向后弯再向上弯，优美月牙弧 -->
  <!-- 左角 -->
  <path d="M 78 130 
           C 65 122, 40 115, 28 100 
           C 18 88, 20 72, 30 60
           C 36 68, 38 82, 48 95
           C 58 106, 68 118, 76 128
           C 78 130, 78 130, 78 130" 
        fill="url(#hornGradC)" stroke="#4A3A20" stroke-width="1.5"/>
  
  <!-- 右角 -->
  <path d="M 122 130 
           C 135 122, 160 115, 172 100 
           C 182 88, 180 72, 170 60
           C 164 68, 162 82, 152 95
           C 142 106, 132 118, 124 128
           C 122 130, 122 130, 122 130" 
        fill="url(#hornGradC)" stroke="#4A3A20" stroke-width="1.5"/>
  
  <!-- 牛脸 -->
  <path d="M 75 130 L 73 200 Q 100 215 127 200 L 125 130 Q 100 118 75 130" 
        fill="url(#faceGradC)" stroke="#2E1A10" stroke-width="1.5"/>
  
  <!-- 眼睛 -->
  <ellipse cx="87" cy="155" rx="7" ry="8" fill="#1A0A04"/>
  <ellipse cx="113" cy="155" rx="7" ry="8" fill="#1A0A04"/>
  <ellipse cx="88" cy="153" rx="2.5" ry="2.5" fill="white" opacity="0.5"/>
  <ellipse cx="114" cy="153" rx="2.5" ry="2.5" fill="white" opacity="0.5"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="190" rx="12" ry="5" fill="#2E1A10"/>
  <ellipse cx="96" cy="191" rx="2.5" ry="2" fill="#0E0602"/>
  <ellipse cx="104" cy="191" rx="2.5" ry="2" fill="#0E0602"/>
</svg>