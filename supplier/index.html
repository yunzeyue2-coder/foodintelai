body{background:#f7f5f0;font-family:'Inter','Noto Serif SC','PingFang SC','Microsoft YaHei',serif;color:#2a2218;padding:0;display:flex;justify-content:center}

.cover{border-bottom:1px solid #e0ddd5;padding-bottom:28px;margin-bottom:36px}

.cover .sub{font-size:13px;color:#8a7a6a;letter-spacing:2px;margin-bottom:6px}
.cover .desc{font-size:12px;color:#b5aaa0;line-height:1.6;max-width:520px}

.section{margin-bottom:36px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,#c4a35a,transparent)}
.sec-h .label{font-size:15px;font-weight:600;color:#8b6914;letter-spacing:3px;white-space:nowrap}
.sec-h .sub{font-size:11px;color:#b5aaa0;letter-spacing:1px;font-weight:400}

/* 供应商卡片 - 1/4 网格 */
.sup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.sup{background:#fff;border:1px solid #e8e3db;border-radius:8px;padding:14px;transition:all .2s;display:flex;flex-direction:column;min-width:0}
@media(max-width:900px){.sup-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.sup-grid{grid-template-columns:1fr}}
.sup:hover{border-color:#c4a35a;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.sup-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.sup-name{font-size:13px;font-weight:700;color:#2a2218;line-height:1.4}
.sup-brand{font-size:11px;padding:2px 8px;border-radius:4px;background:#f0eee8;color:#8b6914;letter-spacing:1px}
.sup-city{font-size:9px;color:#b5aaa0;margin-left:auto}
.sup-pos{font-size:11px;color:#6a5a3a;line-height:1.6;margin-bottom:8px;flex:1}
.sup-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sup-tag{font-size:9px;padding:1px 6px;border-radius:3px;background:#faf8f4;border:1px solid #ece5d8;color:#8a7a6a;letter-spacing:.3px}
.sup-foot{display:flex;align-items:center;gap:10px;border-top:1px solid #f5f2ec;padding-top:10px;font-size:11px;color:#b5aaa0}
.sup-foot .dot{width:5px;height:5px;border-radius:50%;background:#27ae60}
.sup-foot .detail{cursor:pointer;color:#8b6914;font-weight:600;margin-left:auto}

.empty{padding:40px;text-align:center;color:#b5aaa0;font-size:13px;border:1px dashed #e0ddd5;border-radius:10px}

.cta{margin-top:32px;padding:24px;background:#0b1f3a;border-radius:10px;text-align:center}
.cta h3{font-size:16px;color:#fff;letter-spacing:1px;margin-bottom:8px}
.cta p{font-size:12px;color:#8a97ad;line-height:1.7;margin-bottom:14px}
.cta a{display:inline-block;background:#c4a35a;color:#fff;padding:10px 28px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:1px}
.cta a:hover{background:#b3924d}

.footer{text-align:center;padding-top:24px;border-top:1px solid #e0ddd5;font-size:10px;color:#b5aaa0;letter-spacing:1px;margin-top:20px}
