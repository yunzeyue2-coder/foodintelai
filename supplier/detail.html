*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f5f0;font-family:'Inter','Noto Serif SC','PingFang SC','Microsoft YaHei',serif;color:#2a2218;display:flex;justify-content:center}
.page{max-width:760px;width:100%;min-height:100vh;padding:40px 32px 60px}
.back{display:inline-block;font-size:12px;color:#8b6914;text-decoration:none;letter-spacing:1px;margin-bottom:20px}
.back:hover{color:#7a5a04;text-decoration:underline}

.cover{background:#0b1f3a;border-radius:12px;padding:28px 28px 24px;margin-bottom:24px;position:relative}
.cover .badge{font-size:10px;color:#c4a35a;letter-spacing:3px;margin-bottom:10px}

.cover .city{font-size:12px;color:#8a97ad;margin-bottom:12px}
.cover .brand{display:inline-block;font-size:11px;background:#c4a35a;color:#fff;padding:3px 12px;border-radius:4px;letter-spacing:1px}
.cover .pos{font-size:13px;color:#dfe4ec;line-height:1.7;margin-top:12px}

.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,#c4a35a,transparent)}
.sec-h .label{font-size:13px;font-weight:600;color:#8b6914;letter-spacing:2px;white-space:nowrap}
.sec-h .sub{font-size:10px;color:#b5aaa0;letter-spacing:1px}

.box{background:#fff;border:1px solid #e8e3db;border-radius:10px;padding:16px 18px}
.row{display:flex;padding:8px 0;border-bottom:1px solid #f5f2ec;font-size:13px;line-height:1.7}
.row:last-child{border-bottom:none}
.row .k{width:96px;flex-shrink:0;color:#8a7a6a;font-size:12px}
.row .v{color:#2a2218;flex:1}
.row .v .item{display:inline-block;background:#faf8f4;border:1px solid #ece5d8;color:#6a5a3a;font-size:11px;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0}

.note{margin-top:24px;padding:14px 16px;background:#f8f5ef;border-left:3px solid #c4a35a;font-size:11px;color:#8a7a6a;line-height:1.8}
.cta{margin-top:20px;padding:20px;background:#0b1f3a;border-radius:10px;text-align:center}
.cta p{font-size:12px;color:#8a97ad;line-height:1.7;margin-bottom:12px}
.cta a{display:inline-block;background:#c4a35a;color:#fff;padding:9px 26px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:1px}
.footer{text-align:center;padding-top:24px;border-top:1px solid #e0ddd5;font-size:10px;color:#b5aaa0;letter-spacing:1px;margin-top:28px}
